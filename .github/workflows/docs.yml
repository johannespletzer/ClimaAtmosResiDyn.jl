name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The cached parts of the Julia depot, and why only `main` saves a cache: see
# `DEPOT_CACHE_PATHS` in ci.yml.
env:
  # Package images are built for a target every runner supports, so a cache
  # saved on one CPU model loads on another. See `JULIA_CPU_TARGET` in ci.yml.
  JULIA_CPU_TARGET: 'haswell,-rdrnd'
  DEPOT_CACHE_PATHS: |
    ~/.julia/artifacts
    ~/.julia/packages
    ~/.julia/compiled
    ~/.julia/scratchspaces
    ~/.julia/logs

jobs:
  docbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The deploy in docs/make.jl pushes gh-pages with this token, which needs
    # write access to the contents. Without it, every push to main failed at
    # the deploy with 403, after a build that passed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: '1.11'
      - name: Restore the Julia depot
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-docs-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: julia-docs-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Restore and save the Julia depot
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-docs-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: julia-docs-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Install dependencies
        shell: julia --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path="."))
          Pkg.instantiate()
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: julia --project=docs/ docs/make.jl

  comment:
    needs: docbuild
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update preview link
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/previews/PR${pr}/`;
            const marker = '<!-- docs-preview-comment -->';
            const body = `${marker}\n📖 Docs preview for this PR: ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

  # A single check for the doc build that always reports, to require on
  # `main` if checks are ever required.
  docs-required:
    name: docs-required
    needs: [docbuild]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DOCBUILD: ${{ needs.docbuild.result }}
        run: |
          if [[ "$DOCBUILD" == "success" ]]; then
            echo "doc build passed"; exit 0
          fi
          echo "doc build did not pass (result=$DOCBUILD)"
          exit 1
