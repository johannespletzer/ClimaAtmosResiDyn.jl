name: Downstream
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: downstream ClimaCoupler.jl
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1
      # Pinned, not tracking main. ClimaCoupler's AMIP test now needs the
      # `wxquest_initial_conditions` artifact, which is declared with no
      # download block. It resolves only through an Overrides.toml on a cluster
      # that already holds the data, so a GitHub runner can never fetch it. On
      # a newer ref this job fails on that data, not on anything in this
      # repository. See docs/known_issues.md, item 2, for what unpins it.
      - uses: actions/checkout@v7
        with:
          repository: 'CliMA/ClimaCoupler.jl'
          ref: '3d9c07c3ef911991d0b98b70c52154e448feaa02'
          path: ClimaCoupler.jl
      - run: |
          julia --color=yes --project=ClimaCoupler.jl/experiments/AMIP/ -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=ClimaCoupler.jl/experiments/AMIP/ -e 'using Pkg; Pkg.develop(; path = ".")'
          julia --color=yes --project=ClimaCoupler.jl/experiments/AMIP/ ClimaCoupler.jl/experiments/test/runtests.jl
