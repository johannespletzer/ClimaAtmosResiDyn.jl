name: Downstream
# Whether ClimaCoupler's AMIP tests still run with this package in place of
# upstream ClimaAtmos. The coupler only sees the package through its code and
# its dependencies, so the check runs when those change, on one Julia version.
on:
  push:
    branches:
      - main
    tags: '*'
    paths:
      - 'src/**'
      - 'ext/**'
      - 'Project.toml'
      - '.github/workflows/downstream.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'Project.toml'
      - '.github/workflows/downstream.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: downstream ClimaCoupler.jl
    runs-on: ubuntu-latest
    # No depot cache. The coupler environment makes a cache of about 4.5 GB,
    # nearly half of the 10 GB GitHub keeps per repository, and it would push
    # the test caches out. Without a cache, instantiating that environment
    # took 44 to 59 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: actions/checkout@v7
        with:
          repository: 'CliMA/ClimaCoupler.jl'
          path: ClimaCoupler.jl
      - run: |
          julia --color=yes --project=ClimaCoupler.jl/experiments/AMIP/ -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=ClimaCoupler.jl/experiments/AMIP/ -e 'using Pkg; Pkg.develop(; path = ".")'
          julia --color=yes --project=ClimaCoupler.jl/experiments/AMIP/ ClimaCoupler.jl/experiments/test/runtests.jl
