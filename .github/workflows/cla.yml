---
name: CLA Workflow

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write

on:
  merge_group:
  pull_request_target:
    types: [opened, reopened, synchronize, auto_merge_enabled, review_requested]
    branches:
      - main
      - master

jobs:
  cla:
    # The reusable workflow needs CLA_EFFECTIVE_DATE, CLA_API_URL,
    # CLA_API_TOKEN and CLA_ORG_TOKEN, which are CliMA organization secrets.
    # `secrets: inherit` has nothing to inherit in a personal fork, so the job
    # fails in about three seconds with
    # "CLA_EFFECTIVE_DATE is required but was not set", before it reads any
    # file or looks at a single contributor. That is a fork configuration gap
    # rather than a missing signature, and it put a permanently red check on
    # every pull request here that said nothing about the code.
    #
    # Upstream is unaffected: the owner check is true for CliMA, where the
    # secrets exist, and false for a fork, where the job is skipped instead of
    # failing. Comparison is case-insensitive, which is how GitHub Actions
    # compares strings in an expression.
    #
    # If this fork should enforce the CLA, set those four secrets at the fork
    # or organization level and drop this condition.
    if: github.repository_owner == 'CliMA'
    uses: clima/.github/.github/workflows/cla_template.yml@main
    secrets: inherit

