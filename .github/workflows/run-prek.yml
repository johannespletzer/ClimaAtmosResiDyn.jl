name: Prek checks
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Each run on `main`
# has a group of its own. With one shared group, GitHub keeps only one waiting
# run and cancels the one before it, so a merge between two others would get
# no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned deliberately. Without a version this action installs the latest
      # release -- it was Julia 1.12.7 on 2026-08-19 -- while the repository
      # standardises on 1.10/1.11, builds its docs with 1.11, and AGENTS.md
      # tells contributors to format with 1.11. JuliaFormatter formats through
      # the host Julia's parser, so an unpinned runner enforces a formatting
      # no contributor can reproduce, and the hook fails on a correctly
      # formatted tree.
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: j178/prek-action@v2
