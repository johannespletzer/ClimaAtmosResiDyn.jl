name: Downgrade
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Downgrade ${{ matrix.version }} - ubuntu-latest
    runs-on: ubuntu-latest
    # julia-downgrade-compat rewrites Project.toml (test extras are promoted to
    # deps), which makes Aqua's stale-dependency check meaningless here.
    env:
      CLIMAATMOS_DOWNGRADE_CI: 'true'
    strategy:
      # Without this, a failure on one version cancels the other before it
      # reports, so a version-specific regression is indistinguishable from a
      # shared one. Matches the ci workflow.
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: Artifacts, Dates, Downloads, LazyArtifacts, LinearAlgebra, Logging, Printf, Test, Statistics, Random, Pkg, Glib_jll, Musica
          mode: 'forcedeps'

      - uses: julia-actions/julia-buildpkg@latest
      - name: Run infrastructure tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: infrastructure
      - name: Run diagnostics tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: diagnostics
      - name: Run dynamics tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: dynamics
      # One step per tagging group, matching `ci.yml` and `runtests.jl`. A
      # single `TEST_GROUP: tagging` step silently ran nothing once the group
      # was split, and still exited zero, so both downgrade jobs could go green
      # without executing a single tagging test. `runtests.jl` now rejects an
      # unknown group outright, which turns that failure mode into an error
      # rather than a false pass, but the steps still have to be listed here.
      - name: Run tagging_energy tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: tagging_energy
      - name: Run tagging_water tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: tagging_water
      - name: Run tagging_source tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: tagging_source
      - name: Run tagging_record tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: tagging_record
      - name: Run parameterizations tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: parameterizations
      - name: Run restarts tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: restarts
      - name: Run era5 tests
        uses: julia-actions/julia-runtest@latest
        env:
          TEST_GROUP: era5
