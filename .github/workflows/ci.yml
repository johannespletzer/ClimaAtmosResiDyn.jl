name: ci
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  # Merge-queue fast path: decide whether the matrix below can be reused from an
  # already-green PR head (see .github/should_skip_merge_queue.sh). Always runs;
  # only ever returns skip=true for a merge_group build that is provably
  # identical to a PR whose "ci " checks already passed.
  ci-decide:
    name: ci-decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if .github/should_skip_merge_queue.sh "ci "; then
            echo "Merge-queue CI skipped: reusing this PR's green checks."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ci ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.test_group }}
    needs: ci-decide
    if: needs.ci-decide.outputs.skip != 'true'

    runs-on: ${{ matrix.os }}
    # A job killed mid-suite reports `cancelled`, which the ci-required gate
    # cannot distinguish from a superseded run, so the budget has to leave real
    # headroom.
    #
    # The tagged-simulation files are one group per file, because they do not
    # share compilation. A tag name is a type parameter, so each tag set is a
    # fresh `AtmosModel` and recompiles the whole tendency and solve pipeline;
    # putting several files in one job adds their compile times without any
    # reuse. Two rounds of this were learned the hard way: the files first
    # overran `dynamics` (run 32528151981), then overran a combined `tagging`
    # group on 1.11, where `tagged_tracers_integration.jl` alone took 36m57s at
    # 99% compilation and the job was cancelled before the energy-source and
    # process-record files started at all. A timeout does not just fail the
    # group, it silently removes coverage of whatever had not run yet.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
        os:
          - ubuntu-latest
          # There is a concurrency limit for MacOS runners across the
          # entire organization.
          # (see https://docs.github.com/en/actions/reference/limits#job-concurrency-limits-for-github-hosted-runners)
          # To help with this, MacOS runners are only run when PRs are merged
          # into the main branch.
          - ${{ github.event_name == 'push' && 'macos-latest' || '' }}
        exclude:
          - os: ''
        test_group:
          - infrastructure
          - diagnostics
          - dynamics
          - tagging_energy
          - tagging_water
          - tagging_source
          - tagging_record
          - parameterizations
          - restarts
          - era5
    env:
      TEST_GROUP: ${{ matrix.test_group }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{secrets.CODECOV_TOKEN}}

  # Single required status check for branch protection / the merge queue. Set
  # THIS ("ci-required") as the required check instead of the individual matrix
  # jobs, so a reused merge-queue build (matrix skipped) still reports green.
  ci-required:
    name: ci-required
    needs: [ci-decide, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.ci-decide.result }}" != "success" ]]; then
            echo "ci-decide job did not succeed"; exit 1
          fi
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "ci matrix passed"; exit 0
          fi
          if [[ "${{ needs.test.result }}" == "skipped" && \
                "${{ needs.ci-decide.outputs.skip }}" == "true" ]]; then
            echo "ci matrix reused from an already-green PR head"; exit 0
          fi
          echo "ci matrix did not pass (result=${{ needs.test.result }})"
          exit 1
