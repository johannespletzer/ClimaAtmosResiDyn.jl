name: ci
# The test groups run in tiers, so that a pull request does not wait hours in
# the queue. GitHub Free runs 20 jobs at a time for the whole account, and the
# full matrix on both Julia versions was 49 jobs and about 1,450 job-minutes.
# The `plan` job picks the tier; .github/ci_plan.sh says which event gets which,
# and docs/clima_atmos_specific.md ("Which jobs run when") explains why.
#
#   draft pull request             quick: load jobs and `infrastructure` on 1.11
#   pull request ready for review  full: every group on 1.11
#   push to `main`                 cache: load jobs and a cache warm-up, when
#                                  a green `ci-full` tested this exact tree on
#                                  the pull request; full otherwise
#   nightly, Monday to Saturday    the fork's groups on 1.10
#   weekly on Sunday, tags         every group on 1.11, fork's groups on 1.10
#   manual run                     the versions and groups it asks for
#
# The tests run with `check_bounds: auto`, except the weekly run and tags,
# which keep `yes`. `auto` compiled the tagged models 2.2 times faster (see
# .github/ci_plan.sh), and the weekly run still catches an access out of
# bounds. Each setting has caches of its own, since their package images
# differ.
#
# A change that touches only paths no test reads (docs/ except
# docs/src/parent_budget/, experiments/, runscripts/, calibration/, markdown
# at the root, other workflows) runs no test. To test every group on both
# versions, as before, run it by hand: `gh workflow run ci.yml --ref <branch>`.
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    # Listing the types replaces the defaults, so all four are needed.
    # `ready_for_review` starts the full tier when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Keep the second line equal to WEEKLY_CRON in .github/ci_plan.sh.
    - cron: '0 1 * * 1-6'
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Julia versions to test'
        type: choice
        options: ['both', '1.11', '1.10']
        default: 'both'
      groups:
        description: '"all", or test groups separated by commas'
        type: string
        default: 'all'
      check_bounds:
        description: 'julia-runtest check_bounds (yes also checks inside @inbounds)'
        type: choice
        options: ['auto', 'yes']
        default: 'auto'

# A newer push to a pull request cancels its older run. Nothing else is
# cancelled. A push to `main` or a tag has a group per commit, because a later
# merge that only warms the cache must not cancel the full run of an earlier
# merge whose tree nothing tested. A merge must not end the nightly either,
# which is what tests Julia 1.10.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'schedule' && 'schedule' || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The parts of the Julia depot that are cached. Every cache step uses this one
# list, because a cache is only found again under the same paths.
#
# Only runs on `main` save a cache, the schedules included. Every other run
# restores the newest cache from `main` and saves nothing. GitHub keeps 10 GB
# per repository. On 2026-09-17 the caches of pull request runs pushed `main`'s
# out within half an hour.
#
# Each key holds the check-bounds setting, the full Julia version and the UTC
# date. The two settings build different package images. A new patch release
# then starts a new cache instead of adding its package images to the old one.
# The first run of a day on `main` saves the day's cache, and later runs find
# that key and save nothing, which keeps the number of caches down.
#
# The registries are not cached. `julia-buildpkg` installs them in seconds.
env:
  # Package images are built for this target instead of the runner's own CPU.
  # GitHub's runners mix Intel and AMD models, and Julia rebuilt all 317
  # dependencies when a cache saved on one was restored on the other. Every
  # runner supports this target. It does not change the code compiled while
  # the tests run. The target is part of each cache name, so a new target
  # starts new caches.
  JULIA_CPU_TARGET: 'haswell,-rdrnd'
  DEPOT_CACHE_PATHS: |
    ~/.julia/artifacts
    ~/.julia/packages
    ~/.julia/compiled
    ~/.julia/scratchspaces
    ~/.julia/logs
  # Quarantined jobs, `<version>/<group>` separated by spaces, for example
  # '1.10/tagging_water_precipitation'. Such a job still runs and shows its
  # result, but its failure does not fail the run. Only the owner adds one.
  ALLOW_FAIL: ''

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `checks: read` lets it look up `ci-full` on a merged pull request's head,
    # and `actions: read` the commit the last green scheduled run tested.
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      matrix: ${{ steps.plan.outputs.matrix }}
      full_scope: ${{ steps.plan.outputs.full_scope }}
      check_bounds: ${{ steps.plan.outputs.check_bounds }}
      allow_fail: ${{ steps.plan.outputs.allow_fail }}
    steps:
      # The whole history, for the merge's parents and the ancestry test.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # For .github/read_test_groups.jl, which reads the groups from
      # test/runtests.jl.
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      # `shell: bash` adds pipefail, so a failing plan fails the job rather
      # than leaving `tee`'s exit status.
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PUSH_BEFORE: ${{ github.event.before }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_VERSIONS: ${{ inputs.versions }}
          DISPATCH_GROUPS: ${{ inputs.groups }}
          DISPATCH_CHECK_BOUNDS: ${{ inputs.check_bounds }}
        run: bash .github/ci_plan.sh | tee -a "$GITHUB_OUTPUT"

  # Package-load preflight. A syntax or docstring error only shows up during
  # precompilation, so without this gate one bad expression starts the whole
  # matrix and every job fails the same way many minutes in. Two short jobs
  # answer that question first, and the matrix waits for them.
  load:
    name: load ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: ${{ matrix.version }}
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # `load` restores the test jobs' cache and never saves. A cache of its
      # own would take a tenth of the 10 GB. The check-bounds flag is the one
      # the test jobs pass to `Pkg.test`, so the restored package images fit
      # this `using` too.
      - name: Restore the Julia depot
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ steps.day.outputs.day }}
          restore-keys: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      - name: using ClimaAtmos
        env:
          CHECK_BOUNDS: ${{ needs.plan.outputs.check_bounds }}
        run: julia --project=. --color=yes --check-bounds="$CHECK_BOUNDS" -e 'using ClimaAtmos'

  # The minimum-compat check. It runs in every tier except none. The full
  # `Downgrade` matrix only runs weekly and when the compat bounds change
  # (downgrade.yml). This job resolves every dependency at its lowest allowed
  # version on the oldest supported Julia and loads the package. That catches
  # a bound that no longer resolves, and code that needs a newer dependency at
  # load time, such as a name imported from it.
  load-min-compat:
    name: load 1.10 minimum compat
    needs: plan
    if: needs.plan.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: '1.10'
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # A depot of its own, since the versions differ from the test jobs'.
      # Only `main` saves it, as explained at `DEPOT_CACHE_PATHS`.
      - name: Restore the Julia depot
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-ci-min-compat-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ steps.day.outputs.day }}
          restore-keys: julia-ci-min-compat-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Restore and save the Julia depot
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-ci-min-compat-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ steps.day.outputs.day }}
          restore-keys: julia-ci-min-compat-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: Artifacts, Dates, Downloads, LazyArtifacts, LinearAlgebra, Logging, Printf, Test, Statistics, Random, Pkg, Glib_jll, Musica
          mode: 'forcedeps'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      # The downgrade step resolves the packages but does not install their
      # artifacts, and `julia-buildpkg` only builds. The `Downgrade` matrix
      # never noticed, because `Pkg.test` instantiates first. Without this,
      # loading fails on the first missing artifact (NVTX_jll on 2026-09-17).
      - name: using ClimaAtmos
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate(); using ClimaAtmos'

  test:
    name: ci ${{ matrix.version }} - ${{ matrix.test_group }}
    needs: [plan, load]
    # Checked before the matrix expands. A matrix with no entries is an error,
    # and the tiers none and cache have none.
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # A job killed mid-suite reports `cancelled`, which the ci-required gate
    # cannot distinguish from a superseded run, so the time limit has to leave
    # real headroom. The tagged-simulation files are one group per file for
    # the same reason: they share no compilation, so combining them only adds
    # compile time, and a job that overruns drops coverage of whatever had not
    # started.
    timeout-minutes: 90
    continue-on-error: ${{ contains(fromJSON(needs.plan.outputs.allow_fail || '[]'), format('{0}/{1}', matrix.version, matrix.test_group)) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TEST_GROUP: ${{ matrix.test_group }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: ${{ matrix.version }}
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # One cache per Julia version and day, shared by every group, since all
      # groups use the same test environment. On `main`, the first job to
      # finish saves it, and jobs that start later restore that exact key.
      # Other runs only restore (see `DEPOT_CACHE_PATHS`). The CPU model is printed to explain a cache that restores but still
      # precompiles.
      - name: Restore the Julia depot
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ steps.day.outputs.day }}
          restore-keys: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Restore and save the Julia depot
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ steps.day.outputs.day }}
          restore-keys: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      # No coverage. Nothing received it, because the repository has no
      # Codecov token, and on Julia 1.10 coverage also stops the tests from
      # using any package image. To restore it, set `CODECOV_TOKEN` and add
      # `julia-processcoverage` and `codecov-action` on the 1.11 jobs.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
          check_bounds: ${{ needs.plan.outputs.check_bounds }}

  # When a merge skips the tests, this job saves the day's 1.11 test cache, so
  # pull requests keep restoring package images that match `main`. The
  # `precompile` group runs no tests; `Pkg.test` builds the whole test
  # environment before it.
  cache-warm:
    name: cache-warm 1.11
    needs: [plan, load]
    if: needs.plan.outputs.tier == 'cache'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_GROUP: precompile
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: '1.11'
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore and save the Julia depot
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPOT_CACHE_PATHS }}
          key: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-${{ steps.day.outputs.day }}
          restore-keys: julia-ci-test-${{ needs.plan.outputs.check_bounds }}-haswell-${{ steps.setup-julia.outputs.julia-version }}-
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
          check_bounds: ${{ needs.plan.outputs.check_bounds }}

  # A check that always reports. It passes when every job the plan asked for
  # passed. It is the check to require on `main` if one is ever required.
  ci-required:
    name: ci-required
    needs: [plan, load, load-min-compat, test, cache-warm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          LOAD: ${{ needs.load.result }}
          MIN_COMPAT: ${{ needs.load-min-compat.result }}
          TEST: ${{ needs.test.result }}
          WARM: ${{ needs.cache-warm.result }}
        run: |
          if [[ "$PLAN" != "success" ]]; then
            echo "plan did not succeed ($PLAN)"; exit 1
          fi
          bad=0
          need() {
            if [[ "$2" != "success" ]]; then
              echo "$1: $2, but tier $TIER needs it"; bad=1
            fi
          }
          case "$TIER" in
            none) ;;
            cache) need load "$LOAD"; need load-min-compat "$MIN_COMPAT"; need cache-warm "$WARM" ;;
            *) need load "$LOAD"; need load-min-compat "$MIN_COMPAT"; need test "$TEST" ;;
          esac
          if [[ $bad == 0 ]]; then echo "tier $TIER passed"; fi
          exit $bad

  # The marker that every group passed on 1.11 on this commit. It runs only
  # when the plan ran every group on 1.11, and fails
  # unless they all passed. A push to `main` reads it on the merged pull
  # request's head to skip testing the same tree twice. On a draft it is
  # skipped, which a required check would count as passed; a draft cannot be
  # merged, and marking it ready starts a run that sets it.
  ci-full:
    name: ci-full
    needs: [plan, load, load-min-compat, test]
    if: always() && needs.plan.outputs.full_scope == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          LOAD: ${{ needs.load.result }}
          MIN_COMPAT: ${{ needs.load-min-compat.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "load: $LOAD, load-min-compat: $MIN_COMPAT, test: $TEST"
          [[ "$LOAD" == "success" && "$MIN_COMPAT" == "success" && "$TEST" == "success" ]]

  # A red scheduled run opens an issue labelled `nightly-red`, with its tier in
  # the title, or comments on the open one of that tier. A green run of the
  # same tier closes it, and a green weekly run closes them all. The nightly
  # tests only the fork's groups on 1.10, so it cannot clear a weekly failure
  # on 1.11. The repository is public, so an agent without a token can read the
  # issue with plain curl. While one is open, only its fix merges: a red
  # scheduled run is a red check.
  nightly-report:
    name: nightly-report
    needs: [plan, load, load-min-compat, test]
    if: always() && github.event_name == 'schedule' && needs.plan.outputs.tier != 'none'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALLOW_FAIL_JSON: ${{ needs.plan.outputs.allow_fail }}
          TIER: ${{ needs.plan.outputs.tier }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          quarantined=$(jq -r '.[] | split("/") | "ci \(.[0]) - \(.[1])"' <<<"${ALLOW_FAIL_JSON:-[]}")
          failed=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name != "ci-required" and .name != "ci-full")
                  | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .name')
          red=$(grep -v -x -F -f <(printf '%s\n' "$quarantined" | grep -v '^$' || echo '@@none@@') <<<"$failed" | grep -v '^$' || true)
          title="Scheduled ci run on main is red ($TIER)"
          open=$(gh issue list --label nightly-red --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" || true)
          if [[ -n "$red" ]]; then
            body=$(printf 'The %s run on `main` at %s failed:\n\n%s\n\n%s\n' "$TIER" "$GITHUB_SHA" "$(sed 's/^/- /' <<<"$red")" "$RUN_URL")
            if [[ -n "$open" ]]; then
              gh issue comment "$(head -1 <<<"$open")" --body "$body"
            else
              gh label create nightly-red --color B60205 --description "The scheduled ci run on main failed" 2>/dev/null || true
              gh issue create --title "$title" --label nightly-red --body "$body"
            fi
          else
            # A green weekly run tested every group, so it closes every tier's issue.
            if [[ "$TIER" == all ]]; then
              open=$(gh issue list --label nightly-red --state open --json number --jq '.[].number' || true)
            fi
            for n in $open; do
              gh issue close "$n" --comment "The $TIER run at $GITHUB_SHA passed: $RUN_URL"
            done
          fi
