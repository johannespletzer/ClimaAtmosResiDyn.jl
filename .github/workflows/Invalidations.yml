name: Invalidations

# It runs on a pull request to `main` that changes the package's code or
# dependencies, once the pull request is ready for review. It does not run on
# every push to a draft. It builds the package twice without a cache and
# reports only a count. It is not a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'Project.toml'
      - '.github/workflows/Invalidations.yml'

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    # Only run on PRs to the default branch.
    # In the PR trigger above branches can be specified only explicitly whereas this check should work for master, main, or any other default branch
    if: github.base_ref == github.event.repository.default_branch && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1.10'
    - uses: actions/checkout@v7
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-invalidations@v1
      id: invs_pr
      with:
        # The action defaults to the repository name minus `.jl`, which is not
        # the package name in this fork.
        package_name: ClimaAtmos

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-invalidations@v1
      id: invs_default
      with:
        package_name: ClimaAtmos

    - name: Report invalidation counts
      run: |
        echo "Invalidations on default branch: ${{ steps.invs_default.outputs.total }} (${{ steps.invs_default.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
        echo "This branch: ${{ steps.invs_pr.outputs.total }} (${{ steps.invs_pr.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
    # The action writes the counts zero-padded, such as `000004009`, which
    # `fromJSON` rejects, and two strings compare as text. So the step checks
    # that each count has only digits and compares them as base-10 integers.
    - name: Check if the PR does increase number of invalidations
      env:
        PR_TOTAL: ${{ steps.invs_pr.outputs.total }}
        DEFAULT_TOTAL: ${{ steps.invs_default.outputs.total }}
      run: |
        for count in "$PR_TOTAL" "$DEFAULT_TOTAL"; do
          [[ "$count" =~ ^[0-9]+$ ]] || { echo "Not a count: $count"; exit 1; }
        done
        if (( 10#$PR_TOTAL > 10#$DEFAULT_TOTAL )); then
          echo "The PR adds invalidations: $((10#$PR_TOTAL)) against $((10#$DEFAULT_TOTAL))."
          exit 1
        fi
