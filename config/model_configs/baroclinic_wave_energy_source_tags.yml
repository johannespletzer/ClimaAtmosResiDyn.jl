initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
rad: "gray"
dt_rad: "1hours"
t_end: "1days"
# An example of the energy source tags in the layout that makes the per-process
# checks possible, on the sphere the tag-closure experiments closed per process
# (their run C7). See `docs/src/energy_source_tags.md`.
#
#   - `tropics` and `extratropics` partition the total. `e_src_res` sums them.
#   - `new_tropics` and `new_extratropics` collect every process's new energy in
#     their region, through `source: all`.
#   - `sfc`, `rad` and `mp` follow the three processes that change `ρe_tot` on
#     this sphere. A process that runs with no tag of its own is warned about at
#     startup. The rain-out of 0-moment microphysics is one of them, and `mp`
#     follows it.
#   - The records say what each of those processes did at each point.
#
# The closure check is on by default with these tags: daily, report-only, from a
# spin-up reference an hour in. The repair is on by default too, and its ledgers
# are in the default output.

# Required with the tags. The tags partition `ρe_tot + c·ρ`, which this offset
# makes positive everywhere, so the donor share is defined everywhere. The model
# never sees it.
energy_source_tag_offset: 110495.0
energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux
  - name: rad
    source: radiation
  - name: mp
    source: microphysics
  - name: new_tropics
    region: tropics
    source: all
  - name: new_extratropics
    region: extratropics
    source: all
energy_process_record: [radiation, surface_flux, microphysics]
diagnostics:
  - short_name: [ta, e_src_res]
    period: 1hours
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc, e_src_rad, e_src_mp]
    period: 1hours
  - short_name: [e_src_new_tropics, e_src_new_extratropics]
    period: 1hours
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_microphysics]
    period: 1hours
