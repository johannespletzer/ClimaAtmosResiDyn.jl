initial_condition: "DryBaroclinicWave"
t_end: "10days"
dt_save_state_to_disk: "2days"
disable_surface_flux_tendency: true
rad: "held_suarez"
# The tags are chosen so that validation is a set of direct near-zero checks:
#
#   1. Region closure: `tropics` + `extratropics` form an exact partition of
#      unity. So `e_tag_res`, the specific ρe_tot minus the sum of the region
#      tags, starts at machine precision and monitors attribution leakage
#      directly, with no overlapping regions to subtract out.
#   2. Process closure: `hs_tropics` and `hs_extratropics` restrict the
#      Held-Suarez source to each region. Transport is linear and their masks
#      sum to 1, so `e_tag_hs_tropics + e_tag_hs_extratropics` must equal
#      `e_tag_hs` to near machine precision at all times.
#   3. Process behavior: `e_tag_hs` starts at exactly 0 and accumulates the
#      Held-Suarez forcing, growing ever more slowly towards HS equilibrium.
#
# For an altitude decomposition, use a `tanh_altitude` region and its exact
# complement (`above: false`) rather than adding an overlapping tag to this
# set. `e_tag_res` sums all pure region tags, so they must form a single
# partition of unity for the residual to be a clean leakage monitor.
tagged_tracers:
  - name: tropics
    region: {type: tanh_latitude, lat_bound: 20.0, width: 2.0}
  - name: extratropics
    region: {type: tanh_latitude, lat_bound: 20.0, width: 2.0, inside: false}
  - name: hs
    source: held_suarez
  - name: hs_tropics
    region: {type: tanh_latitude, lat_bound: 20.0, width: 2.0}
    source: held_suarez
  - name: hs_extratropics
    region: {type: tanh_latitude, lat_bound: 20.0, width: 2.0, inside: false}
    source: held_suarez
diagnostics:
  - short_name: [pfull, ua, wa, va, rv, ta, ke]
    period: 1days
  - short_name: [e_tag_tropics, e_tag_extratropics, e_tag_res]
    period: 1days
  - short_name: [e_tag_hs, e_tag_hs_tropics, e_tag_hs_extratropics]
    period: 1days
