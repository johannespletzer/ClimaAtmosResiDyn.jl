initial_condition: "DryBaroclinicWave"
t_end: "10days"
dt_save_state_to_disk: "2days"
disable_surface_flux_tendency: true
rad: "held_suarez"
# A short validation job for the energy tags. The tag set is chosen so each
# check is a direct near-zero comparison.
#
#   1. Region closure. `tropics` and `extratropics` partition the globe, so
#      `e_tag_res`, the specific ρe_tot minus the sum of the region tags, starts
#      at machine precision and then tracks attribution leakage on its own, with
#      no overlapping regions to subtract out.
#   2. Process closure. `hs_tropics` and `hs_extratropics` split the
#      Held-Suarez source by region. Transport is linear and their masks sum to
#      1, so `e_tag_hs_tropics + e_tag_hs_extratropics` equals `e_tag_hs` to
#      near machine precision at all times.
#   3. Process behavior. `e_tag_hs` starts at 0 and accumulates the Held-Suarez
#      forcing, growing more slowly as it approaches HS equilibrium.
#
# `e_tag_res` sums every pure region tag, so they have to form a single
# partition of unity for the residual to read as leakage. For an altitude
# decomposition, pair a `tanh_altitude` region with its exact complement
# (`above: false`) rather than adding an overlapping tag to this set.

# The same closure check the water tags use, run against `ρe_tot`.
energy_closure_check:
  period: "1days"
  # A placeholder rather than a measured threshold, as in the water job, and
  # looser again. The energy tags miss by more, because they receive their
  # transport explicitly and carry no EDMFX SGS mass fluxes. Read
  # `energy_tag_closure.csv` from a run and tighten it.
  tolerance: 1.0e-2
energy_tracers:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: hs
    source: held_suarez
  - name: hs_tropics
    region: tropics
    source: held_suarez
  - name: hs_extratropics
    region: extratropics
    source: held_suarez
diagnostics:
  - short_name: [pfull, ua, wa, va, rv, ta, ke]
    period: 1days
  - short_name: [e_tag_tropics, e_tag_extratropics, e_tag_res]
    period: 1days
  - short_name: [e_tag_hs, e_tag_hs_tropics, e_tag_hs_extratropics]
    period: 1days
