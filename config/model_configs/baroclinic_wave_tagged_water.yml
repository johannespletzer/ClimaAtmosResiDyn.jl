initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "10days"
dt_save_state_to_disk: "2days"
# A short validation job for the water tags. The tag set is chosen so each
# check is a direct near-zero comparison.
#
#   1. Region closure. `tropics` and `extratropics` partition the globe, so
#      `q_tag_res`, the specific ρq_tot minus the sum of the region tags, starts
#      at machine precision. After that it measures the vertical advection
#      split, since the tags are advected explicitly and ρq_tot implicitly. The
#      diffusion and hyperdiffusion operators match, so this residual stays well
#      below the tagged-energy `e_tag_res`.
#   2. Process closure. `evap_tropics` and `evap_extratropics` split the surface
#      moisture source by region. Every step of the attribution is linear, so
#      `q_tag_evap_tropics + q_tag_evap_extratropics` equals `q_tag_evap` to
#      near machine precision at all times. A gap there is a bug.
#   3. Process behavior. `q_tag_evap` starts at 0, grows where the surface
#      evaporates, and drains in proportion to its own share.
#
# `q_tag_res` sums every pure region tag, as `e_tag_res` does, so configure one
# partition of unity per run.

# Check during the run that the region tags still add up to total water. This
# adds no tendency, so simulation output is unchanged. It writes
# `water_tag_closure.csv`.
water_closure_check:
  period: "1days"
  # Loose on purpose, and looser than the default. This job exercises the code
  # path rather than gating on a measured number. At this level the partition is
  # structurally broken rather than merely drifting. Read
  # `water_tag_closure.csv` from a run and tighten it.
  tolerance: 1.0e-4
water_tracers:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: evap
    source: surface_flux
  - name: evap_tropics
    region: tropics
    source: surface_flux
  - name: evap_extratropics
    region: extratropics
    source: surface_flux
diagnostics:
  - short_name: [pfull, ua, va, ta, hus, husv]
    period: 1days
  - short_name: [q_tag_tropics, q_tag_extratropics, q_tag_res]
    period: 1days
  - short_name: [qv_tag_tropics, qv_tag_extratropics]
    period: 1days
  - short_name: [q_tag_evap, q_tag_evap_tropics, q_tag_evap_extratropics]
    period: 1days
  # This config sets no limiter and no nonnegativity constraint, so everything
  # in `q_tag_fix_*` comes from `repair_water_tag_partition!`. It measures how
  # much water the repair moved to keep the partition non-negative, which reads
  # directly on transport drift. The values are cumulative, so compare
  # differences between outputs rather than averaging.
  - short_name: [q_tag_fix_tropics, q_tag_fix_extratropics]
    period: 1days
