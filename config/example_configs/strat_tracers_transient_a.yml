job_id: "strat_tracers_transient_a"

# ===========================================================================
# Transient stratospheric passive tracer residence times, 1979-2021 -- member A
# ===========================================================================
#
# One of two members of the campaign described in
# docs/strat_tracer_campaign_plan.md. The members share this configuration and
# differ only in which model levels carry source boxes, so between them they
# sample six levels from 10 to 55 km. They are separate integrations, not one
# integration replicated. With `rad: allsky` their trajectories diverge
# chaotically. That suits a multi-year climatology, and it belongs in any
# statement of the results.
#
# Pair with config/common_configs/numerics_sphere_he16ze120_top80.yml. The
# source-box face heights below are taken from that grid, so changing `z_elem`,
# `z_max`, `dz_bottom` or `z_stretch` moves the model levels and leaves those
# heights stale with no warning.
#
# Resubmitting continues from the newest checkpoint, which `detect_restart_file`
# picks up. `t_end` here is the campaign end. See the chaining script for how
# each job gets a shorter segment end that lands on a checkpoint.
# ===========================================================================

start_date: "19790101"
t_end: "15341days"          # 1979-01-01 -> 2021-01-01
FLOAT_TYPE: "Float64"       # burden differencing over decades

initial_condition: "WeatherModel"
# Directory holding era5_init_processed_internal_19790101_0000.nc, on model
# levels reaching into the mesosphere. Pressure-level ERA5 stops near 1 hPa,
# around 48 km, which would leave the top 30 km of this domain
# flat-extrapolated.
era5_initial_condition_dir: ~

# ---------------------------------------------------------------------------
# Transient forcing
# ---------------------------------------------------------------------------
rad: "allsky"
dt_rad: "1hours"
insolation: "timevarying"
time_varying_trace_gases: ["CO2", "O3"]
aerosol_radiation: true
prescribed_aerosols: ["CB1", "CB2", "DST01", "DST02", "DST03", "DST04", "DST05", "OC1", "OC2", "SO4", "SSLT01", "SSLT02", "SSLT03", "SSLT04", "SSLT05"]
topography: "Earth"
topo_smoothing: true
non_orographic_gravity_wave: true
dt_nogw: "360secs"          # an integer multiple of dt, unlike amip_target's 400s
microphysics_model: "0M"
turbconv: "edonly_edmfx"
edmfx_sgs_diffusive_flux: true
surface_setup: "DefaultMoninObukhov"
prognostic_surface: "SeasonalSST"    # zonally symmetric SST with a seasonal cycle
# The seasonal cycle in the lower boundary is a primary driver of the
# stationary-wave forcing that sets the Brewer-Dobson circulation and the polar
# vortex life cycle, and the steady profile carries none of it. `SeasonalSST`
# restores the midlatitude ocean part. The land and sea-ice seasonality stays
# out of reach, since standalone ClimaAtmos has no model for it.

toml: [toml/strat_tracers_transient.toml]

# ---------------------------------------------------------------------------
# Source boxes
#
# Nine latitude bands 10 degrees wide, centred 0, +/-25, +/-35, +/-60, +/-80.
# The 25/35 pair shares an edge at 30 degrees, bracketing the subtropical mixing
# barrier so the step in residence time across it is measured directly. The
# +/-60 band samples the vortex edge and +/-80 the polar cap.
#
# Heights are the enclosing faces of single model levels, so each box is one
# grid layer thick over flat terrain. Over orography the SLEVE-warped coordinate
# shifts the levels through the fixed window and a box may catch two centres.
# The residence times hold regardless, since burden and source share a mask.
# ---------------------------------------------------------------------------
dt_tracer_budget: "30days"
passive_tracers:
  heights_from: "altitude"
  production_rate: 1.0e-10
  loss_timescale: "6hours"
  release_boxes:
    - {latitude: [-85.0, -75.0], height: [9989.7, 10404.8]}   # 80S, level 34
    - {latitude: [-85.0, -75.0], height: [27896.0, 28623.5]}   # 80S, level 66
    - {latitude: [-85.0, -75.0], height: [45380.1, 46322.6]}   # 80S, level 87
    - {latitude: [-65.0, -55.0], height: [9989.7, 10404.8]}   # 60S, level 34
    - {latitude: [-65.0, -55.0], height: [27896.0, 28623.5]}   # 60S, level 66
    - {latitude: [-65.0, -55.0], height: [45380.1, 46322.6]}   # 60S, level 87
    - {latitude: [-40.0, -30.0], height: [27896.0, 28623.5]}   # 35S, level 66
    - {latitude: [-40.0, -30.0], height: [45380.1, 46322.6]}   # 35S, level 87
    - {latitude: [-30.0, -20.0], height: [27896.0, 28623.5]}   # 25S, level 66
    - {latitude: [-30.0, -20.0], height: [45380.1, 46322.6]}   # 25S, level 87
    - {latitude: [-5.0, 5.0], height: [27896.0, 28623.5]}   # EQ, level 66
    - {latitude: [-5.0, 5.0], height: [45380.1, 46322.6]}   # EQ, level 87
    - {latitude: [20.0, 30.0], height: [27896.0, 28623.5]}   # 25N, level 66
    - {latitude: [20.0, 30.0], height: [45380.1, 46322.6]}   # 25N, level 87
    - {latitude: [30.0, 40.0], height: [27896.0, 28623.5]}   # 35N, level 66
    - {latitude: [30.0, 40.0], height: [45380.1, 46322.6]}   # 35N, level 87
    - {latitude: [55.0, 65.0], height: [9989.7, 10404.8]}   # 60N, level 34
    - {latitude: [55.0, 65.0], height: [27896.0, 28623.5]}   # 60N, level 66
    - {latitude: [55.0, 65.0], height: [45380.1, 46322.6]}   # 60N, level 87
    - {latitude: [75.0, 85.0], height: [9989.7, 10404.8]}   # 80N, level 34
    - {latitude: [75.0, 85.0], height: [27896.0, 28623.5]}   # 80N, level 66
    - {latitude: [75.0, 85.0], height: [45380.1, 46322.6]}   # 80N, level 87
    # Bulk reference. One box over the whole domain from 20 to 55 km. It
    # encloses the sampled boxes on purpose, and the tracers are independent,
    # so a shared point simply feeds both. Its base sits at 20 km because at
    # fixed altitude the source is proportional to density. A 10 km base would
    # put most of the emission in the upper troposphere, below the tropical
    # tropopause.
    - {latitude: [-90.0, 90.0], height: [20000.0, 55000.0]}

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
dt_save_state_to_disk: "30days"
detect_restart_file: true
output_default_diagnostics: false

diagnostics:
  # The surface the tracers are removed below. It also identifies which low
  # boxes sit under the local tropopause and should be discarded.
  - short_name: [ztrop]
    reduction_time: average
    period: 30days
    writer: netcdf

  # The residence times come from the budget table rather than these fields. A
  # low-frequency sample over 42 years is still cheap insurance against a
  # surprise the table alone cannot diagnose.
  - short_name: [ta, ua, va, pfull]
    reduction_time: average
    period: 30days
    writer: netcdf
