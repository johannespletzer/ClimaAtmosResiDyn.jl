job_id: "equatorial_stratospheric_tracer"
dt: "10secs"
t_end: "1weeks"
output_dir_style: "removepreexisting"
# A global cubed sphere with 1 km vertical resolution up to 30 km.
h_elem: 6
z_elem: 30
z_max: 30000
z_stretch: false
output_default_diagnostics: false

diagnostics:
  # Resolve the source-region evolution during the one-minute example run.
  - short_name: q_equatorial
    period: 10secs
    pressure_coordinates: true
    writer: netcdf

  # Retain a time mean of the complete example run.
  - short_name: q_equatorial
    reduction_time: average
    period: 1mins
    compute_every: 5secs
    pressure_coordinates: true
    writer: netcdf
