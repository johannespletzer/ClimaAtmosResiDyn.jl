job_id: "strat_tracers_transient_b"

# ===========================================================================
# Transient stratospheric passive tracer residence times, 1979-2021 -- member B
# ===========================================================================
#
# One of two members of the campaign described in
# docs/strat_tracer_campaign_plan.md. The members share this configuration and
# differ only in which model levels carry source boxes, so between them they
# sample six levels from 10 to 55 km. They are separate integrations, not one
# integration replicated: with `rad: allsky` their trajectories diverge
# chaotically, which is fine for a multi-year climatology but should be stated
# with the results.
#
# Pair with config/common_configs/numerics_sphere_he16ze120_top80.yml, whose
# grid the source-box face heights below are taken from. Changing `z_elem`,
# `z_max`, `dz_bottom` or `z_stretch` moves the model levels and silently
# invalidates those heights.
#
# Resubmitting continues from the newest checkpoint; `detect_restart_file`
# picks it up. `t_end` here is the campaign end -- see the chaining script for
# how each job is given a shorter segment end that lands on a checkpoint.
# ===========================================================================

start_date: "19790101"
t_end: "15341days"          # 1979-01-01 -> 2021-01-01
FLOAT_TYPE: "Float64"       # burden differencing over decades

initial_condition: "WeatherModel"
# Directory holding era5_init_processed_internal_19790101_0000.nc, on model
# levels reaching into the mesosphere. Pressure-level ERA5 stops near 1 hPa
# (~48 km) and would be flat-extrapolated over the top 30 km of this domain.
era5_initial_condition_dir: ~

# ---------------------------------------------------------------------------
# Transient forcing
# ---------------------------------------------------------------------------
rad: "allsky"
dt_rad: "1hours"
insolation: "timevarying"
time_varying_trace_gases: ["CO2", "O3"]
aerosol_radiation: true
prescribed_aerosols: ["CB1", "CB2", "DST01", "DST02", "DST03", "DST04", "DST05", "OC1", "OC2", "SO4", "SSLT01", "SSLT02", "SSLT03", "SSLT04", "SSLT05"]
topography: "Earth"
topo_smoothing: true
non_orographic_gravity_wave: true
dt_nogw: "360secs"          # an integer multiple of dt, unlike amip_target's 400s
microphysics_model: "0M"
turbconv: "edonly_edmfx"
edmfx_sgs_diffusive_flux: true
surface_setup: "DefaultMoninObukhov"
prognostic_surface: "SeasonalSST"    # zonally symmetric SST with a seasonal cycle
# The steady profile has no seasonal cycle in the lower boundary at all, and
# that cycle is a primary driver of the stationary-wave forcing which sets the
# Brewer-Dobson circulation and the polar vortex life cycle. `SeasonalSST`
# restores the midlatitude ocean part of it. It still cannot supply the land
# and sea-ice seasonality, which standalone ClimaAtmos has no model for.

toml: [toml/strat_tracers_transient.toml]

# ---------------------------------------------------------------------------
# Source boxes
#
# Nine latitude bands 10 degrees wide, centred 0, +/-25, +/-35, +/-60, +/-80.
# The 25/35 pair shares an edge at 30 degrees, bracketing the subtropical
# mixing barrier so the step in lifetime across it is measured rather than
# interpolated through; +/-60 samples the vortex edge and +/-80 the polar cap.
#
# Heights are the enclosing faces of single model levels, so each box is one
# grid layer thick over flat terrain. Over orography the SLEVE-warped
# coordinate shifts the levels through the fixed window, so a box may catch two
# centres; lifetimes are unaffected because burden and source come from the
# same mask.
# ---------------------------------------------------------------------------
dt_tracer_budget: "30days"
passive_tracers:
  heights_from: "altitude"
  production_rate: 1.0e-10
  loss_timescale: "6hours"
  release_boxes:
    - {latitude: [-85.0, -75.0], height: [18821.2, 19402.1]}   # 80S, level 52
    - {latitude: [-85.0, -75.0], height: [36485.7, 37329.9]}   # 80S, level 77
    - {latitude: [-85.0, -75.0], height: [54173.9, 55191.1]}   # 80S, level 96
    - {latitude: [-65.0, -55.0], height: [18821.2, 19402.1]}   # 60S, level 52
    - {latitude: [-65.0, -55.0], height: [36485.7, 37329.9]}   # 60S, level 77
    - {latitude: [-65.0, -55.0], height: [54173.9, 55191.1]}   # 60S, level 96
    - {latitude: [-40.0, -30.0], height: [18821.2, 19402.1]}   # 35S, level 52
    - {latitude: [-40.0, -30.0], height: [36485.7, 37329.9]}   # 35S, level 77
    - {latitude: [-40.0, -30.0], height: [54173.9, 55191.1]}   # 35S, level 96
    - {latitude: [-30.0, -20.0], height: [18821.2, 19402.1]}   # 25S, level 52
    - {latitude: [-30.0, -20.0], height: [36485.7, 37329.9]}   # 25S, level 77
    - {latitude: [-30.0, -20.0], height: [54173.9, 55191.1]}   # 25S, level 96
    - {latitude: [-5.0, 5.0], height: [18821.2, 19402.1]}   # EQ, level 52
    - {latitude: [-5.0, 5.0], height: [36485.7, 37329.9]}   # EQ, level 77
    - {latitude: [-5.0, 5.0], height: [54173.9, 55191.1]}   # EQ, level 96
    - {latitude: [20.0, 30.0], height: [18821.2, 19402.1]}   # 25N, level 52
    - {latitude: [20.0, 30.0], height: [36485.7, 37329.9]}   # 25N, level 77
    - {latitude: [20.0, 30.0], height: [54173.9, 55191.1]}   # 25N, level 96
    - {latitude: [30.0, 40.0], height: [18821.2, 19402.1]}   # 35N, level 52
    - {latitude: [30.0, 40.0], height: [36485.7, 37329.9]}   # 35N, level 77
    - {latitude: [30.0, 40.0], height: [54173.9, 55191.1]}   # 35N, level 96
    - {latitude: [55.0, 65.0], height: [18821.2, 19402.1]}   # 60N, level 52
    - {latitude: [55.0, 65.0], height: [36485.7, 37329.9]}   # 60N, level 77
    - {latitude: [55.0, 65.0], height: [54173.9, 55191.1]}   # 60N, level 96
    - {latitude: [75.0, 85.0], height: [18821.2, 19402.1]}   # 80N, level 52
    - {latitude: [75.0, 85.0], height: [36485.7, 37329.9]}   # 80N, level 77
    - {latitude: [75.0, 85.0], height: [54173.9, 55191.1]}   # 80N, level 96

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
dt_save_state_to_disk: "30days"
detect_restart_file: true
output_default_diagnostics: false

diagnostics:
  # The surface the tracers are removed below, and what identifies which low
  # boxes sit below the local tropopause and must be discarded.
  - short_name: [ztrop]
    reduction_time: average
    period: 30days
    writer: netcdf

  # The lifetimes come from the budget table, not from these fields, but a
  # low-frequency sample over 42 years is cheap insurance against a surprise
  # the table alone cannot diagnose.
  - short_name: [ta, ua, va, pfull]
    reduction_time: average
    period: 30days
    writer: netcdf
