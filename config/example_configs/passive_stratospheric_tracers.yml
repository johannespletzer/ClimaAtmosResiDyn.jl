job_id: "passive_stratospheric_tracers"

# ===========================================================================
# Stratospheric passive tracer residence times
# ===========================================================================
#
# 24 inert tracers, one per source region on a grid of latitude boxes by height
# boxes. The boxes sample the model domain above the tropopause. There are 6
# latitude boxes 10 degrees wide, centred from 75S to 75N, crossed with 4 height
# boxes 2 km deep, stacked every 10 km from the local tropopause up to 32 km
# above it. Small boxes are the point. A tracer emitted over a deep layer or a
# wide latitude range reports a residence time averaged over conditions that can
# differ by years. Every tracer is removed below the tropopause and nowhere
# else, so once its burden stops drifting its residence time is
#
#     tau = burden / source
#
# Both are written to `stratospheric_tracer_budget.csv` in the output directory
# every `dt_tracer_budget`, together with
# `imbalance = (source - loss) / source`, which tells you whether equilibrium
# has been reached. `post_processing/tracer_residence_times.jl` summarises it.
#
# The 6 x 4 grid is sized by compilation cost. Setup is almost entirely
# compilation and grows steeply with the tracer count. perf/tracer_scaling.jl
# measures it at roughly N^2.9, about 17 minutes at 24 tracers against over two
# hours at 48, paid again on every launch and restart. Within that budget the
# stack is coarsened rather than truncated, with 4 height bands at double the
# spacing so it still reaches the same altitude, because the deep stratosphere
# is where the long residence times are. To cover more regions, run several
# configurations with different slices of the source grid. The tracers are inert
# and independent of each other.
#
# Expect this to be a long run. Stratospheric residence times are of order 1-5
# years, so the burden needs several times that to settle, on top of the ~1 year
# the aquaplanet circulation itself needs to spin up. Resubmit the same config
# to continue from the newest checkpoint, which `detect_restart_file` picks up
# automatically.
# ===========================================================================

passive_tracers:
  release_grid:
    latitude_bands: 6
    latitude_width: 10.0
    height_bands: 4
    height_depth: 2000.0
    height_spacing: 10000.0
  heights_from: "tropopause"
  # Sets the magnitude of the tracers. The burden and the source are both
  # linear in it and only their ratio is reported, so the residence times are
  # unaffected.
  production_rate: 1.0e-10
  # Short next to the residence times being measured, which run to years, and
  # long next to the timestep. That approximates "zero below the tropopause"
  # closely while keeping the explicit tendency from stiffening.
  loss_timescale: "6hours"
dt_tracer_budget: "10days"

# ---------------------------------------------------------------------------
# Dynamics: moist aquaplanet with RRTMGP radiation
#
# Numerics follow config/common_configs/numerics_sphere_he6ze31.yml, the
# validated 6-element and 60 km-top combination, on the finer ze63 vertical grid
# so the tropopause bounding the tracers is resolved. `dt` is cut from that
# file's 400 s to suit the finer grid. Confirm it in a short run before
# committing to a multi-year integration.
# ---------------------------------------------------------------------------
config: sphere
# Float64 rather than the Float32 default. The residence times come from global
# burdens accumulated over years and from their drift between output times. The
# burden integral is summed over ~10^5 points and then differenced, and that
# cancellation needs more than Float32's seven digits.
FLOAT_TYPE: "Float64"
h_elem: 6         # ~550 km
nh_poly: 3
z_elem: 63
z_max: 60000.0
dz_bottom: 30.0
dt: "300secs"
t_end: "3650days"
ode_algo: "ARS343"
hyperdiff: "Hyperdiffusion"
rayleigh_sponge: true
viscous_sponge: true
implicit_diffusion: true
approximate_linear_solve_iters: 2
max_newton_iters_ode: 1
# zd_rayleigh = zd_viscous = 40 km, matching the 60 km model top. The sponges
# act on momentum and on horizontal tracer mixing alone, so the upper source
# regions keep their tracer mass.
toml: [toml/longrun_aquaplanet.toml]

rad: "allsky"
dt_rad: "1hours"
microphysics_model: "0M"
surface_setup: "DefaultMoninObukhov"
turbconv: "edonly_edmfx"
edmfx_sgs_diffusive_flux: true

dt_save_state_to_disk: "90days"
detect_restart_file: true

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_default_diagnostics: false

diagnostics:
  # Monthly means of the tracer mass fractions. Instantaneous 3-D output of 24
  # tracers would dominate the run's disk usage, and the residence times come
  # from the budget table rather than these fields. One name per line, because
  # the oldest YAML.jl our `[compat]` allows reads a bracketed list only when
  # it sits on a single line.
  - short_name:
      - q_gas_y01z01
      - q_gas_y02z01
      - q_gas_y03z01
      - q_gas_y04z01
      - q_gas_y05z01
      - q_gas_y06z01
      - q_gas_y01z02
      - q_gas_y02z02
      - q_gas_y03z02
      - q_gas_y04z02
      - q_gas_y05z02
      - q_gas_y06z02
      - q_gas_y01z03
      - q_gas_y02z03
      - q_gas_y03z03
      - q_gas_y04z03
      - q_gas_y05z03
      - q_gas_y06z03
      - q_gas_y01z04
      - q_gas_y02z04
      - q_gas_y03z04
      - q_gas_y04z04
      - q_gas_y05z04
      - q_gas_y06z04
    reduction_time: average
    period: 30days
    writer: netcdf

  # The surface the tracers are bounded by, and the state that sets it.
  - short_name: [ztrop]
    reduction_time: average
    period: 30days
    writer: netcdf

  - short_name: [ta, ua, va, wa, pfull, rhoa, hus]
    reduction_time: average
    period: 30days
    writer: netcdf
