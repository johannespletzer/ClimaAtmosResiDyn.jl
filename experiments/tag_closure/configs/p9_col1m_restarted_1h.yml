# Part 9, PR B (design/PART9_PRODUCER.md, section 12, the amendment of
# 2026-10-11): the integration test's precipitating column
# (test/water_tag_applications_common.jl at 2c63c5c53), 1M microphysics with
# the precipitation tags, for 1 h. The TRMM 0M case corrects no partition in
# 6 h, so every final map and post-Newton map there is zero and dropped. This
# case fires them. The restarted run of the column's restart pair, from the
# on run's checkpoint at 30 min to 1 h (design section 13, 2026-10-11). The
# model restarts this column exactly, which it does not do for the TRMM case
# (FINDINGS E54). Submit it only after `p9_col1m_on_1h` has finished.

job_id: "p9_col1m_restarted_1h"
restart_file: "/dss/dsstbyfs02/scratch/0D/di38kez/tag_closure/output/p9_col1m_on_1h/output_0000/day0.1800.hdf5"
water_tag_applications: true

# Checkpoints every 30 min and a reproducible restart in both column runs, as
# in the TRMM set. The on run's checkpoint at 30 min starts the restart pair
# (design section 13, 2026-10-11).
dt_save_state_to_disk: "30mins"
reproducible_restart: true

water_tracers:
  - name: lower
    region: {type: tanh_altitude, z_center: 3000.0, width: 300.0, above: false}
  - name: upper
    region: {type: tanh_altitude, z_center: 3000.0, width: 300.0}
  - name: evap
    source: surface_flux

water_tag_precipitation: true
water_tag_transport: "increment"
water_tag_ledger_per_tag: true

config: column
initial_condition: PrecipitatingColumn
surface_setup: DefaultMoninObukhov
z_elem: 20
z_max: 6000.0
z_stretch: false
cloud_model: "grid_scale"
microphysics_model: "1M"
vert_diff: "DecayWithHeightDiffusion"
implicit_diffusion: true
approximate_linear_solve_iters: 2
tracer_upwinding: "first_order"
dt: 10secs
t_end: 1hours
toml: [toml/single_column_precipitation_test.toml]
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  # Part 9's checks: every accepted step (dt = 10 s). rhoa aligns the
  # producer's ledgers for the reader.
  - short_name: [rhoa, ta, hus]
    period: "10secs"
