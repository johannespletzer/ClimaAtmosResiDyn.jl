# V-W3's Newton ladder on the 0M copies (the owner's review of #101, P1):
# `w3_trmm0m_copies` with 2 Newton iterations. The copies' rain-out has no
# Jacobian entry, as `q_totʲ`'s has none (known issue 4); the ladder bounds
# the copies' lag, their residual and their repair.
# V-W3, the deep 0M development case (G3_PLAN 6): TRMM_LBA with 0-moment
# microphysics under prognostic EDMF, 3 h, as
# `config/model_configs/prognostic_edmfx_trmm_column_0M.yml`. The copies, started
# from the default mode's plume by the D4-W driver; its pair is
# `w3_trmm0m_default`.
#
# The partition is the boundary layer `pbl`, below 1 km, and the free
# troposphere `free` above; `evap` is the surface flux. Deep convection
# carries the boundary layer's water to the upper troposphere and rains it
# out, so the 0M rain-out mirror and the exchange are both exercised. The
# model has no passive tracer, and the driver sets none.
job_id: "w3_trmm0m_copies_n2"

water_tracers:
  - name: pbl
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0, above: false}
  - name: free
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0}
  - name: evap
    source: surface_flux

water_closure_check:
  period: "30mins"
  audit: true

initial_condition: TRMM_LBA
turbconv: prognostic_edmfx
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "PiGroups"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
cloud_model: "grid_scale"
microphysics_model: "0M"
config: column
z_max: 16400
x_elem: 2
y_elem: 2
z_elem: 82
z_stretch: false
dz_bottom: 30
dt: 150secs
t_end: 3hours
toml: [toml/prognostic_edmfx_implicit_scm_calibrated_5_cases_shallow_deep_v1.toml]
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  - short_name: [rhoa, ta, hus, clw, cli, wa]
    period: "30mins"
  - short_name: [pr, evspsbl, hfls, hfss, lwp]
    period: "30mins"
  - short_name: [pr]
    period: "30mins"
    reduction_time: average
  - short_name: [arup, rhoaup, waup, husup, clwup, cliup]
    period: "30mins"
  - short_name: [aren, rhoaen, waen, husen]
    period: "30mins"
  - short_name: [tke, entr, detr]
    period: "30mins"
  - short_name: [q_tag_res, q_tag_pbl, q_tag_free, q_tag_evap]
    period: "30mins"
  - short_name: [q_tag_fix_pbl, q_tag_fix_free, q_tag_fix_evap]
    period: "30mins"
  - short_name: [q_tag_copy_res, q_tag_upfix_pbl, q_tag_upfix_free]
    period: "30mins"

water_tag_updraft_copy: true

max_newton_iters_ode: 2
