# V-W10 (WP9), water family, both modes: TRMM 0M under prognostic EDMF, with no
# tags and nothing written. The driver `analysis/wp9_cost_driver.jl` adds the
# tags, the mode and the variant from its environment; see design/WP9_COST.md.
# The column is W26's, as `w4a_trmm0m_default_6h` and the cost figures of W30
# and W34 have it, so the numbers stay comparable.
#
# The closure check and every diagnostic are off, so the timing is the tags'
# own cost and not the check's (T2, T3).
job_id: "wp9_water_trmm0m_edmf"

initial_condition: TRMM_LBA
turbconv: prognostic_edmfx
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "PiGroups"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
cloud_model: "grid_scale"
microphysics_model: "0M"
config: column
z_max: 16400
x_elem: 2
y_elem: 2
z_elem: 82
z_stretch: false
dz_bottom: 30
dt: 150secs
t_end: 6hours
toml: [toml/prognostic_edmfx_implicit_scm_calibrated_5_cases_shallow_deep_v1.toml]
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics: []
