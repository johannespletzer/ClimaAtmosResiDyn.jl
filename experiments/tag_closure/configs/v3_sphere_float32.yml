# V3, sphere, Float32. `c7_sphere_mp` with `FLOAT_TYPE: Float32`, and nothing
# else changed (OPERATIONAL_TODO.md, V3). The owner approved it on 2026-09-14.
#
# No run with the tags has used Float32, and production will. The records are
# `FT` fields that accumulate from the start of the run and are never reset, and
# the closure check sums over the whole domain. Against C7, the same run in
# Float64, this one shows what single precision does to the closure residual,
# the records, form A and the tags.
#
# C7 ran at `414f5f1b`. The model has changed since, but not on this run's path
# (0M, tracer transport, repair off): the EDMF refusal, the label warnings and
# the audit's hyperdiffusion do not act here. If a difference does not look like
# precision, a Float64 rerun at this commit would separate the two.
#
# `ta` will differ from C7's, because the precision does.
job_id: "v3_sphere_float32"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: false

# C7's sphere, in Float32.
config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "400secs"
ode_algo: "ARS343"
rayleigh_sponge: false
viscous_sponge: false

initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "1days"
FLOAT_TYPE: "Float32"

rad: "gray"
dt_rad: "1hours"

energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux
  - name: rad
    source: radiation
  - name: mp
    source: microphysics
  - name: new_tropics
    region: tropics
    source: all
  - name: new_extratropics
    region: extratropics
    source: all

energy_process_record: [radiation, surface_flux, microphysics]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc, e_src_rad]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_tropics, e_src_new_extratropics]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_microphysics]
    period: "1hours"
  - short_name: [ta]
    period: "1hours"
