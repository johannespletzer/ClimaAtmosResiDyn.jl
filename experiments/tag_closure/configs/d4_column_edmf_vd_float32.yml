# D4 with the updrafts' vertical diffusion on, in Float32:
# `d4_column_edmf_vd` with `FLOAT_TYPE: "Float32"`, and nothing else changed.
#
# Production is Float32 (decision of 2026-09-11). C1b's sharing under EDMF has
# run only in Float64 (E53). This run shows whether it holds at production
# precision. The Float64 twin gave a `gross_relative` of 6.0e-3 at 24 h. It was
# zero-sum (untagged 3.67e5 against overclaimed 3.16e5 J/m²), and form B closed.
#
# What it decides: whether Float32 adds to the residual, whether the residual
# stays zero-sum, and whether the tags and the records stay finite and in range.
# V3 found the energy source tags on a sphere closing in Float32 as in Float64
# over a day (E45). This is the EDMF counterpart. `ta` is not compared with the
# Float64 twin's, because the two precisions give different atmospheres.
#
# Run it from a worktree of C1b (#91). Offset 110,495 J/kg is exact in Float32.
job_id: "d4_column_edmf_vd_float32"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true

# `config/model_configs/prognostic_edmfx_dycoms_rf02_column.yml`, with C8's
# cloud fall speed and radiation. The updrafts' vertical diffusion is on, as
# the shipped config has it.
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"

dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float32"

energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation
  - name: sfc
    source: surface_flux
  - name: sub
    source: subsidence
  - name: mp
    source: microphysics
  - name: new_strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
    source: all
  - name: new_tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
    source: all

energy_process_record:
  [radiation, surface_flux, subsidence, microphysics, precipitation]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad, e_src_sfc, e_src_sub]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_strat, e_src_new_tropo]
    period: "1hours"
  - short_name: [e_src_fix_strat, e_src_fix_tropo, e_src_fix_rad, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_fix_sub, e_src_fix_mp, e_src_fix_new_strat]
    period: "1hours"
  - short_name: [e_src_fix_new_tropo]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_subsidence]
    period: "1hours"
  - short_name: [e_prc_microphysics, e_prc_precipitation]
    period: "1hours"
  - short_name: [rhoa, ta]
    period: "1hours"
