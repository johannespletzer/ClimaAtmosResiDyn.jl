# G2, V2: the production physics on a sphere under the increment prototype, in
# Float32, for ten days. `g2_v2_sphere_test` with `t_end: 10days` and a daily
# checkpoint, and nothing else changed: EDMF with the updrafts' vertical
# diffusion, implicit eddy diffusion, both sponges, a DCMIP200 mountain and 1M,
# on the shipped EDMF sphere's grid and step. It runs on 24 MPI ranks from a
# worktree of the prototype at `04d63916` or later.
#
# It writes what item 10 of OPERATIONAL_TODO.md asks for, hourly rather than
# six-hourly: `e_src_res`, `rhoa`, every tag and the 3-D process records, and
# the closure check with its audit. Also the increment ledger and `ta`.
#
# What it decides: whether the prototype keeps the sphere closed over ten
# days, and how the residual's growth compares with its loss rate (E60). Its
# twin `g2_v2_sphere_newton10` gives the per-tag error of the one-iteration
# solve, as E66 did on D4.
job_id: "g2_v2_sphere"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true
energy_source_tag_transport: "enthalpy_increment"

config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "20secs"
ode_algo: "ARS222"
topography: "DCMIP200"
rayleigh_sponge: true
viscous_sponge: true
surface_setup: "DefaultMoninObukhov"
rad: "clearsky"
dt_rad: "1hours"
turbconv: "prognostic_edmfx"
prognostic_tke: true
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
implicit_diffusion: true
approximate_linear_solve_iters: 2
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
toml: [toml/prognostic_edmfx_1M.toml]
t_end: "10days"
dt_save_state_to_disk: "1days"
FLOAT_TYPE: "Float32"

energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux
  - name: rad
    source: radiation
  - name: mp
    source: microphysics
  - name: new_tropics
    region: tropics
    source: all
  - name: new_extratropics
    region: extratropics
    source: all

energy_process_record: [radiation, surface_flux, microphysics, precipitation]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res, rhoa]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc, e_src_rad]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_tropics, e_src_new_extratropics]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_microphysics]
    period: "1hours"
  - short_name: [e_prc_precipitation]
    period: "1hours"
  - short_name: [e_src_inc_left, e_src_inc_moved]
    period: "1hours"
  - short_name: [ta]
    period: "1hours"
