# C3. `c0_column` with an energy process record beside the source tags.
#
# Two readings of one run. The source tags say what share of the energy present
# now came from radiation; the record says what radiation did to ρe_tot since
# the run started. They are different quantities and neither can be read off the
# other, so where they disagree is the measurement.
#
# This matters because the docs name water source tracing plus an energy process
# record as the fallback if the source tags do not work out. This run is what
# shows what that fallback actually reads.
#
# A naming trap worth stating. The prognostic field is `prc_e_radiation`, with
# no `ρ` prefix so that `gs_tracer_names` does not pick it up and transport it.
# The *diagnostic* short name is the other way round, `e_prc_radiation`, and
# that is what the block below has to ask for.

job_id: "c3_column_record"

# The DYCOMS source column of `test/energy_source_tags_integration.jl`, run for
# a day instead of the test's 20 s. The geometry is load-bearing: without
# `z_max`, `z_elem` and `z_stretch` the 1.5 km boundary-layer profile is
# extrapolated over the default 30 km column, pressure runs down to zero and the
# solve dies in `exner_given_pressure`.
config: "column"
initial_condition: "DYCOMS_RF02"
z_max: 1500.0
z_elem: 30
z_stretch: false
microphysics_model: "0M"

# Radiation has to be on for the `rad` source tag to receive anything.
# `initial_condition: DYCOMS_RF02` sets the state, not the forcing.
rad: "DYCOMS"

dt: "10secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

# `strat` and `tropo` split the column at 750 m and are exact complements, so
# the pair partitions ρe_tot. `e_src_res` sums those two and nothing else. `rad`
# follows radiation, which is the process that actually forces this column.
#
# The check errors at startup without a tag carrying a `region` and no `source`.
energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation

# The same labels the source tags carry, so the two readings are of the same
# process. A record is a prognostic field but not a tracer: nothing transports
# it, and it accumulates from the start of the run rather than holding a share.
energy_process_record: [radiation]

# Hourly over a day. `tolerance` unset, so the family default applies and the
# run only warns. `nonpositive_fraction` is the column this phase turns on: it
# is the fraction of the domain where ρe_tot ≤ 0, and where that holds the donor
# share is undefined and the loss half of the rule does not run at all.
energy_source_closure_check:
  period: "1hours"

# Instantaneous, defaults off. `e_prc_radiation` is the record's diagnostic
# short name; the state field it reads is `prc_e_radiation`.
output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad]
    period: "1hours"
  - short_name: [e_prc_radiation]
    period: "1hours"
