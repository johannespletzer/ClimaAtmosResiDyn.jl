# G4.16's validation (design/ENERGY_SEDIMENTATION_CROSS_BLOCKS.md, section 6),
# pre-registered before any run. G4.15's D4 day (`g415_inc_d4_after`): 1M
# stepped implicitly, one Newton iteration, a day, eight energy tags under
# `enthalpy_increment`. Run from the code with the cross blocks and the guard,
# no energy tags: the parity twin.

job_id: "g416_d4_untagged"

# `d4_column_edmf`, unchanged.
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: false
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"

dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  # The model's own fields, for parity (bit for bit) between the runs.
  - short_name: [rhoa, ta, hus, clw, cli, husra, hussn, wa]
    period: "1hours"
  - short_name: [pr, prra, prsn, hfls, hfss, lwp, rwp]
    period: "1hours"
  - short_name: [arup, rhoaup, waup, husup, clwup, cliup, husraup, hussnup]
    period: "1hours"
  - short_name: [tke, edt, evu]
    period: "1hours"
