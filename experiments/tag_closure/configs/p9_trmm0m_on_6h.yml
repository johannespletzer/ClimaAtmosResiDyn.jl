# Part 9, PR B (design/PART9_PRODUCER.md, section 5): the part 8 default case
# (`p8_trmm0m_default_6h.yml`, W58's TRMM 0M default for 6 h) run from
# claude/part9-producer at 2c63c5c53.
# The run with the key: weights, rollback, roster, parity (with `off`) and the
# continuous run of the restart pair.
# Only the job_id, these comment lines, the keys below, the checkpoints and the
# 150 s diagnostics differ from the part 8 file.

job_id: "p9_trmm0m_on_6h"
water_tag_applications: true

# Part 9: hourly checkpoints, read by the parity and restart checks, and a
# reproducible restart in every run of the set, so the runs differ only in the
# keys named above.
dt_save_state_to_disk: "1hours"
reproducible_restart: true

water_tracers:
  - name: pbl
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0, above: false}
  - name: free
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0}
  - name: evap
    source: surface_flux

water_tag_transport: "increment"
water_tag_ledger_per_tag: true

water_closure_check:
  period: "30mins"
  audit: true

initial_condition: TRMM_LBA
turbconv: prognostic_edmfx
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "PiGroups"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
cloud_model: "grid_scale"
microphysics_model: "0M"
config: column
z_max: 16400
x_elem: 2
y_elem: 2
z_elem: 82
z_stretch: false
dz_bottom: 30
dt: 150secs
t_end: 6hours
toml: [toml/prognostic_edmfx_implicit_scm_calibrated_5_cases_shallow_deep_v1.toml]
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  - short_name: [rhoa, ta, hus, clw, cli, wa]
    period: "30mins"
  - short_name: [pr, evspsbl, hfls, hfss, lwp]
    period: "30mins"
  - short_name: [pr]
    period: "30mins"
    reduction_time: average
  - short_name: [arup, rhoaup, waup, husup, clwup, cliup]
    period: "30mins"
  - short_name: [aren, rhoaen, waen, husen]
    period: "30mins"
  - short_name: [tke, entr, detr]
    period: "30mins"
  - short_name: [q_tag_res, q_tag_pbl, q_tag_free, q_tag_evap]
    period: "30mins"
  - short_name: [q_tag_fix_pbl, q_tag_fix_free, q_tag_fix_evap]
    period: "30mins"
  - short_name: [pr_tag_pbl, pr_tag_free, pr_tag_evap, prra_tag_pbl, prsn_tag_pbl]
    period: "30mins"

  - short_name: [q_tag_inc_left, q_tag_inc_moved]
    period: "30mins"
  # Each tag's own ledgers and the ledgers per mechanism, as in every
  # validation run since 2026-09-24.
  - short_name: [q_tag_led_fix_pbl, q_tag_led_fix_free, q_tag_led_fix_evap]
    period: "30mins"
  - short_name: [q_tag_led_fixgross_pbl, q_tag_led_fixgross_free, q_tag_led_fixgross_evap]
    period: "30mins"
  - short_name: [q_tag_led_rescale_gross, q_tag_led_empty_gross, q_tag_led_repair_gross, q_tag_led_repairnet_gross]
    period: "30mins"
  - short_name: [q_tag_led_inc_pbl, q_tag_led_inc_free, q_tag_led_inc_evap]
    period: "30mins"

  # Part 9's checks: every accepted step (dt = 150 s). rhoa aligns the
  # producer's ledgers for the reader. The model's own ledgers tie the records
  # per tag. ta and hus add parent fields to the parity at step cadence.
  - short_name: [rhoa, ta, hus]
    period: "150secs"
  - short_name: [q_tag_led_fix_pbl, q_tag_led_fix_free, q_tag_led_fix_evap]
    period: "150secs"
  - short_name: [q_tag_led_inc_pbl, q_tag_led_inc_free, q_tag_led_inc_evap]
    period: "150secs"

# Compared runs reset the radiation's seed (RUNS.md, 2026-10-02). TRMM_LBA
# here has no RRTMGP radiation, so the key changes nothing.
radiation_reset_rng_seed: true
