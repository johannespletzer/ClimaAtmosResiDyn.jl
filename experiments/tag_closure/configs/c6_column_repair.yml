# C6, column, repair on. C5's column on the code that brackets the implicit
# microphysics sink and repairs negative tags (FINDINGS §8), with the process
# C5 found missing.
#
# C5's per-process check found subsidence: the DYCOMS setup runs it, and no tag
# listed it (FINDINGS E20). Here `sub` follows it, and the records cover every
# process that changes the column's energy: radiation, the surface flux,
# subsidence, and the 0-moment rain-out, which reaches the records on the
# implicit path now. So:
#   - form A should close: `new_strat + new_tropo` against `rad + sfc + sub`, up
#     to the per-tag limiter, the clamp and, with the repair on, its ledgers;
#   - form B should split C5's unexplained 1.37 MJ/m² into its parts, and what
#     is left is the numerics;
#   - `e_src_fix_<name>` says how much the repair moved.
#
# Its twin, `c6_column_no_repair`, is this run with the repair off. The model
# never reads the tags, so `ta` must be identical in the two, to the last bit.
#
# `all` expands to every process label, `precipitation` included, which the
# initialization warns about. That is expected.
job_id: "c6_column_repair"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true

# C3's column, unchanged.
config: "column"
initial_condition: "DYCOMS_RF02"
z_max: 1500.0
z_elem: 30
z_stretch: false
microphysics_model: "0M"
rad: "DYCOMS"

dt: "10secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation
  - name: sfc
    source: surface_flux
  - name: sub
    source: subsidence
  - name: new_strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
    source: all
  - name: new_tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
    source: all

energy_process_record: [radiation, surface_flux, subsidence, microphysics]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad, e_src_sfc, e_src_sub]
    period: "1hours"
  - short_name: [e_src_new_strat, e_src_new_tropo]
    period: "1hours"
  - short_name: [e_src_fix_strat, e_src_fix_tropo, e_src_fix_rad, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_fix_sub, e_src_fix_new_strat, e_src_fix_new_tropo]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_subsidence]
    period: "1hours"
  - short_name: [e_prc_microphysics]
    period: "1hours"
  - short_name: [rhoa, ta]
    period: "1hours"
