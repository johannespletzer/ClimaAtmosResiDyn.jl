# D4, column, EDMF, 1-moment microphysics, tracer transport. The shipped DYCOMS
# RF02 EDMF column with C8's tags and records (FINDINGS E33;
# SUBGRID_AND_MICROPHYSICS_DESIGN.md).
#
# It runs today only with `edmfx_vertical_diffusion: false`. Every shipped EDMF
# config sets it true, and then the SGS diffusive flux asks the updraft for a
# tag field it does not carry
# (`src/prognostic_equations/edmfx_sgs_flux.jl:403-409`). See the design's build
# checks.
#
# Today the tags get no SGS mass flux and no sedimentation corrections. A field
# with no updraft copy has a zero difference-form SGS flux, and the corrections
# are not shared. So `e_src_res` carries both. Read it against C8, the same tags
# on a column without EDMF, whose residual's gross was 2.46e6 J/m² at 24 h
# (E33), most of it pressure work.
#
# What it decides:
#   - today: how much of `e_src_res` EDMF adds, and so whether option B must be
#     built before any EDMF run with tags is read;
#   - after B: the same run is B's validation. The SGS part of the residual
#     should be gone, leaving C8's kind of residual.
#
# Neither per-process check can see the SGS gap. Form A's two sides are both
# overlays moved by the same transport, so a transport they both miss cancels.
# Form B sums the records over the column, where the SGS fluxes cancel. Only
# the closure residual shows it.
#
# Its twin, `d4_column_edmf_enthalpy`, differs only in how the tags move. The
# model never reads the tags, so `ta` must be identical in the two, to the
# last bit.
#
# `all` includes `precipitation`, and so does the record, so the initialization
# warns twice. That is expected.
job_id: "d4_column_edmf"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true

# `config/model_configs/prognostic_edmfx_dycoms_rf02_column.yml`, with the
# updrafts' vertical diffusion off, and C8's cloud fall speed and radiation.
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: false
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"

dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation
  - name: sfc
    source: surface_flux
  - name: sub
    source: subsidence
  - name: mp
    source: microphysics
  - name: new_strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
    source: all
  - name: new_tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
    source: all

energy_process_record:
  [radiation, surface_flux, subsidence, microphysics, precipitation]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad, e_src_sfc, e_src_sub]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_strat, e_src_new_tropo]
    period: "1hours"
  - short_name: [e_src_fix_strat, e_src_fix_tropo, e_src_fix_rad, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_fix_sub, e_src_fix_mp, e_src_fix_new_strat]
    period: "1hours"
  - short_name: [e_src_fix_new_tropo]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_subsidence]
    period: "1hours"
  - short_name: [e_prc_microphysics, e_prc_precipitation]
    period: "1hours"
  - short_name: [rhoa, ta]
    period: "1hours"
