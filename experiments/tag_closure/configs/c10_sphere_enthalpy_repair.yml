# C10, sphere, the audit with the repair on. `c9_sphere_enthalpy` with
# `energy_source_tag_repair: true`, and the repair's ledgers in the output.
#
# Under the audit, C9's sphere stops the residual from growing, but its form A
# worsens to 77 J/kg, against C7's 20, where the tags that carry a source go
# negative (FINDINGS E34). A negative tag's share is clamped to zero, so the
# overlays' fluxes no longer add up. With the repair on, the tags stay
# non-negative where their total is positive, and the clamp has nothing to
# clamp. So form A should come back to C7's 20 J/kg or below. If it does not,
# the clamp is not the cause.
#
# The repair moves energy between tags, so form A is also read with its ledgers
# taken back out, as `analysis/c5_process_closure.jl` does. `ta` must be
# identical to C9's and C7's, to the last bit, since only the tags differ.
job_id: "c10_sphere_enthalpy_repair"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true
energy_source_tag_transport: "enthalpy"

# C5's sphere, unchanged.
config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "400secs"
ode_algo: "ARS343"
rayleigh_sponge: false
viscous_sponge: false

initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "1days"
FLOAT_TYPE: "Float64"

rad: "gray"
dt_rad: "1hours"

energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux
  - name: rad
    source: radiation
  - name: mp
    source: microphysics
  - name: new_tropics
    region: tropics
    source: all
  - name: new_extratropics
    region: extratropics
    source: all

energy_process_record: [radiation, surface_flux, microphysics]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc, e_src_rad]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_tropics, e_src_new_extratropics]
    period: "1hours"
  - short_name: [e_src_fix_tropics, e_src_fix_extratropics, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_fix_rad, e_src_fix_mp, e_src_fix_new_tropics]
    period: "1hours"
  - short_name: [e_src_fix_new_extratropics]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_microphysics]
    period: "1hours"
  - short_name: [ta]
    period: "1hours"
