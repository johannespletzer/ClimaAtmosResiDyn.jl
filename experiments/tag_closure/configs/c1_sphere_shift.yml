# C1. The barrier census again, under a shifted energy reference.
#
# `c0_sphere` measured that `rho_e_tot` is non-positive over 43.276% of the
# domain, so `energy_source_fraction` returns zero there and the loss half of
# the donor rule never runs while production still does. This run is the same
# sphere with the thermodynamic reference moved down 110 K, which makes specific
# `e_tot` positive everywhere and lets the donor rule run for the first time.
#
# **This run needs the owner's approval before submission.** It changes the
# model's energy reference, so `rho_e_tot` is a different number everywhere and
# `reproducibility_tests/ref_counter.jl` would bump for any job that adopted the
# shift. Nothing here touches model code.
#
# The question, from `docs/src/tag_closure_experiments.md`: does `e_src_res`
# stay bounded, and does every tag stay non-negative over a day, once the donor
# rule actually runs?
#
# Read against `c0_sphere` and `c0_sphere_audit`, which are the same
# configuration unshifted. Two comparisons matter and one trap sits between
# them.
#
#   - `nonpositive_fraction` should be 0.0 at every sample here against 0.43276
#     there. That is the shift working, and it is also the run's own check that
#     the shift was large enough (see below).
#   - The per-tag minima should stay non-negative. On the unshifted sphere a
#     source tag reached -209 J/kg with `e_src_res` showing nothing, because the
#     residual sums only the pure region tags.
#   - **`gross_relative` is NOT comparable with `c0_sphere`'s.** The closure
#     check normalises by the integral of |rho_e_tot|, which the shift grows by
#     2.85x (measured on this run, FINDINGS E15), so the same absolute residual
#     reports a smaller relative one.
#     A number that looks better here may be an artifact of the denominator. The
#     absolute `gross_residual` column is the one to compare.
#
# The shift itself is `toml/tag_closure_c1_reference.toml`, which carries the
# derivation, the acceptance test and the reason for the margin. Run its
# acceptance test before trusting anything this run produces: a mistyped key
# leaves a parameter at its default and the run proceeds quietly with a shift
# that is not the one intended.
job_id: "c1_sphere_shift"

# The reference shift. Three coupled entries: the reference temperature and the
# two latent heats anchored on it, moved together so that every latent heat and
# the saturation vapour pressure are unchanged while `e_int` moves by
# +110,495 J/kg.
toml: [toml/tag_closure_c1_reference.toml]

config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "400secs"
ode_algo: "ARS343"
rayleigh_sponge: false
viscous_sponge: false

initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "1days"
FLOAT_TYPE: "Float64"

# `tropics` and `extratropics` are exact complements and partition rho_e_tot.
# `sfc` follows the turbulent surface energy flux, which is on by default and is
# the process that forces this configuration. Identical to `c0_sphere`, so the
# tags are not a variable between the two runs.
energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux

# Hourly over a day, `tolerance` unset.
#
# `audit` is on, and here it earns its keep twice over. `nonpositive_mass_fraction`
# says not merely whether any cell went non-positive but whether those cells hold
# any energy: A5 showed a `nonpositive_fraction` of 0.351 against a mass fraction
# of 2.77e-7, so a volume fraction on its own can badly overstate the problem.
# And `orphaned` and `overclaimed` are the two signed halves of the residual,
# which this family has never had separated -- `e_src_res` sums the region tags
# only, so a source tag drifting negative has so far shown up only in the
# per-tag minima.
energy_source_closure_check:
  period: "1hours"
  audit: true

# Instantaneous, defaults off. No ledger exists for this family, so there is no
# operator-residual subtraction to make. The per-tag fields are here because
# `e_src_res` covers the region tags only, so a source tag going negative never
# shows up in it and has to be watched directly.
output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc]
    period: "1hours"
