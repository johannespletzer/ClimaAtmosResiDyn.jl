# V-W8's untagged twin: `w8_gcm_tags` without water or energy tags, for
# parity. Every field it writes must be bit for bit that run's.
job_id: "w8_gcm_untagged"

initial_condition: "GCM"
external_forcing_file: artifact"cfsite_gcm_forcing"/HadGEM2-A_amip.2004-2008.07.nc
cfsite_number: "site23"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
rayleigh_sponge: true
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
microphysics_model: "0M"
config: "column"
z_max: 40e3
z_elem: 60
z_stretch: true
dz_bottom: 30
perturb_initstate: false
dt: "10secs"
dt_rad: "30mins"
t_end: "3hours"
toml: [toml/prognostic_edmfx_gcmdriven.toml]
rad: allskywithclear
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  - short_name: [rhoa, ta, hus, clw, cli, wa]
    period: "30mins"
  - short_name: [pr, evspsbl, hfls, hfss, lwp]
    period: "30mins"
  - short_name: [arup, rhoaup, waup, husup, aren, rhoaen, waen, husen]
    period: "30mins"
  - short_name: [tke, edt, evu, entr, detr]
    period: "30mins"
  - short_name: [pr]
    period: "30mins"
    reduction_time: average
