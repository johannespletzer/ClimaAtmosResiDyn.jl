# D1, column, 1-moment microphysics, cold: sedimentation's upward branch in a
# run (FINDINGS §7, E32; SUBGRID_AND_MICROPHYSICS_DESIGN.md). It runs today.
#
# `PrecipitatingColumn` starts with cloud ice at 6 to 9 km and snow at 5 to
# 8 km, where the air is well below freezing. Falling ice carries negative
# energy against the reference plus the offset, about -382 + Φ + 110 kJ/kg at
# 250 K. So the energy flux points up while the ice falls, and each face takes
# the shares of the cell below. On this column's initial state every ice and
# snow cell takes that branch, and the partition closes to 100 eps (the
# design's build checks). No run has followed it through time. The region
# boundary sits at 5 km, inside the snow, so snowfall crosses it, and `lower`
# is carried up across it.
#
# The ice here does not last. The profile's air is below ice saturation aloft,
# so most of the ice sublimates within the first minute. The build check, on
# this column at half the resolution, found 16 cells above 1e-9 kg/kg after
# 60 s, against 79 at the start. So the upward
# branch acts early and briefly. That is why this run samples every minute and
# ends after an hour. D5, where convection keeps making ice, tests the branch
# for longer.
#
# What it decides:
#   - whether the partition stays closed through ice sedimentation in a run.
#     The closure residual should not jump where the ice falls;
#   - whether the tags stay non-negative through the upward branch, read from
#     `e_src_fix_<name>` with the repair on;
#   - form A: `new_upper + new_lower` against `sfc + mp`. Both sides move by the
#     same shares, so ice should open no gap;
#   - form B: the three records against the change in the column's `ρe_tot`.
#
# `mp` and `e_prc_microphysics` must read zero. Under 1M the microphysics moves
# water between species only, and never writes `ρe_tot`. The energy leaves
# through sedimentation, which `e_prc_precipitation` records.
#
# `all` includes `precipitation`, and so does the record, so the initialization
# warns twice. That is expected.
job_id: "d1_column_1m_ice"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true

# `config/model_configs/single_column_precipitation_2M_test.yml`'s column,
# under 1M.
config: "column"
initial_condition: "PrecipitatingColumn"
surface_setup: "DefaultMoninObukhov"
z_elem: 200
z_max: 10000.0
z_stretch: false
cloud_model: "grid_scale"
microphysics_model: "1M"
use_sgs_quadrature: false
vert_diff: "DecayWithHeightDiffusion"
implicit_diffusion: true
approximate_linear_solve_iters: 2

dt: "10secs"
t_end: "1hours"
FLOAT_TYPE: "Float64"

energy_source_tags:
  - name: upper
    region: {type: tanh_altitude, z_center: 5000.0, width: 200.0}
  - name: lower
    region: {type: tanh_altitude, z_center: 5000.0, width: 200.0, above: false}
  - name: sfc
    source: surface_flux
  - name: mp
    source: microphysics
  - name: new_upper
    region: {type: tanh_altitude, z_center: 5000.0, width: 200.0}
    source: all
  - name: new_lower
    region: {type: tanh_altitude, z_center: 5000.0, width: 200.0, above: false}
    source: all

energy_process_record: [surface_flux, microphysics, precipitation]

energy_source_closure_check:
  period: "1mins"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1mins"
  - short_name: [e_src_upper, e_src_lower, e_src_sfc, e_src_mp]
    period: "1mins"
  - short_name: [e_src_new_upper, e_src_new_lower]
    period: "1mins"
  - short_name: [e_src_fix_upper, e_src_fix_lower, e_src_fix_sfc]
    period: "1mins"
  - short_name: [e_src_fix_mp, e_src_fix_new_upper, e_src_fix_new_lower]
    period: "1mins"
  - short_name: [e_prc_surface_flux, e_prc_microphysics, e_prc_precipitation]
    period: "1mins"
  - short_name: [rhoa, ta]
    period: "1mins"
