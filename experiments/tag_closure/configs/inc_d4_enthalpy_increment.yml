# The increment prototype on D4: `d4_column_edmf_enthalpy` with
# `energy_source_tag_transport: enthalpy_increment`, and nothing else changed.
# It runs from the worktree `../ClimaAtmosResiDyn-inc`, which holds the
# prototype. After each implicit solve the tags take the parent's increment of
# `E`, not only their shares of its implicit tendencies.
#
# What it decides: whether following the parent's increment removes the
# implicit timing gap that made every C1c placement worse (E59). Its reference
# is `c1c_base_d4_enthalpy`, the same configuration on the same `main`: a gross
# residual of 6.32e5 J/m² at 24 h. The target is 1e4 J/m² or less, with `ta`
# bit for bit.
job_id: "inc_d4_enthalpy_increment"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true
energy_source_tag_transport: "enthalpy_increment"

# `d4_column_edmf`, unchanged.
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: false
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"

dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation
  - name: sfc
    source: surface_flux
  - name: sub
    source: subsidence
  - name: mp
    source: microphysics
  - name: new_strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
    source: all
  - name: new_tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
    source: all

energy_process_record:
  [radiation, surface_flux, subsidence, microphysics, precipitation]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad, e_src_sfc, e_src_sub]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_strat, e_src_new_tropo]
    period: "1hours"
  - short_name: [e_src_fix_strat, e_src_fix_tropo, e_src_fix_rad, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_fix_sub, e_src_fix_mp, e_src_fix_new_strat]
    period: "1hours"
  - short_name: [e_src_fix_new_tropo]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_subsidence]
    period: "1hours"
  - short_name: [e_prc_microphysics, e_prc_precipitation]
    period: "1hours"
  - short_name: [rhoa, ta]
    period: "1hours"
