# G4.16's validation (design/ENERGY_SEDIMENTATION_CROSS_BLOCKS.md, section 6),
# pre-registered before any run. E80's case: W23's column (DYCOMS RF02, 1M,
# EDMF, ARS222, an hour, one Newton iteration), microphysics explicit, the
# energy source tags under `enthalpy_increment`. Run from the code without them
# (#105, `claude/water-tags-sed-cross`) and the guard (#108).

job_id: "g416_expl_n1_off"

initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
implicit_microphysics: false
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"
max_newton_iters_ode: 1
dt: "120secs"
t_end: "1hours"
FLOAT_TYPE: "Float64"

energy_source_tag_offset: 110495.0
energy_source_tag_transport: "enthalpy_increment"
# The guard (#108) refuses this combination without the opt-in.
energy_source_tag_increment_allow_explicit_microphysics: true
energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: sfc
    source: surface_flux
energy_source_closure_check:
  period: "10mins"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res, e_src_strat, e_src_tropo, e_src_sfc, e_src_inc_left, e_src_inc_moved]
    period: "10mins"
  # The model's own fields, for parity (bit for bit) between the runs.
  - short_name: [rhoa, ta, hus, clw, cli, husra, hussn, wa]
    period: "10mins"
  - short_name: [pr, prra, prsn, hfls, hfss, lwp, rwp]
    period: "10mins"
  - short_name: [arup, rhoaup, waup, husup, clwup, cliup, husraup, hussnup]
    period: "10mins"
  - short_name: [tke, edt, evu]
    period: "10mins"
