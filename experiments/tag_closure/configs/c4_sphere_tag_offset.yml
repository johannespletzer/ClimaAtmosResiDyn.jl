# C4. C1's positive total, made in the tags instead of in the model.
#
# C1 moved the thermodynamic reference so that rho_e_tot is positive everywhere,
# and the donor rule ran everywhere for the first time. But its twin tests found
# that the moved reference also changes the simulated atmosphere slightly,
# mostly through the van Leer limiter on vertical energy transport (FINDINGS
# E16). This run gets the same positive total without touching the model.
# `energy_source_tag_offset` makes the tags partition rho_e_tot + c*rho, a total
# only the tags ever see.
#
# c = 110495 J/kg is cp_d * 110 K, C1's shift for dry air, so the tags start
# close to C1's. They differ by C1's extra (cp_l - cp_d) * 110 K * q_tot, a few
# kJ/kg in the moist tropics. The atmosphere is c0_sphere_audit's, bit for bit.
#
# Read it against three runs:
#   - `c0_sphere_audit` on terrabyte: the same atmosphere with the tags on
#     rho_e_tot.
#   - `c1_sphere_shift`: the same tag rule under a moved reference. If E11 to
#     E15 carry over to a few percent, they belong to the tag rule and not to
#     C1's slightly different atmosphere.
#   - `c4_sphere_tag_offset_2x`: the same atmosphere with twice the offset,
#     which measures how much a larger offset dulls the tags (R11).
#
# `ta` is written hourly only to check that the atmosphere really is the same: it
# must be identical, to the last bit, in this run and in the 2x run.
# `gross_relative` is not comparable with c0_sphere_audit's, because the offset
# grows the normalising scale. Compare the absolute `gross_residual`.
job_id: "c4_sphere_tag_offset"

energy_source_tag_offset: 110495.0

config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "400secs"
ode_algo: "ARS343"
rayleigh_sponge: false
viscous_sponge: false

initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "1days"
FLOAT_TYPE: "Float64"

# The same three tags as c0_sphere_audit and C1. `tropics` and `extratropics`
# are exact complements and partition the offset total. `sfc` follows the
# turbulent surface energy flux.
energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux

# Hourly over a day, `tolerance` unset, and the audit on so that the direction of
# the residual can be read against C1's.
energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc]
    period: "1hours"
  - short_name: [ta]
    period: "1hours"
