# MP1, sphere, 4 MPI processes. `c7_sphere_mp` on 4 ranks, and nothing else
# changed (OPERATIONAL_TODO.md, MP1). The owner approved it on 2026-09-14.
#
# Every run with the tags so far used one process. The closure check reduces
# with global sums, and the tags' transport crosses the ranks' boundaries.
# Against C7, the same run on one process, the closure table, the tags and `ta`
# should agree to rounding.
#
# Submit it with `--ntasks=4`. The runscript then launches the ranks with `srun`
# and sets `CLIMACOMMS_CONTEXT=MPI`.
job_id: "mp1_sphere_4ranks"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: false

# C7's sphere, unchanged.
config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "400secs"
ode_algo: "ARS343"
rayleigh_sponge: false
viscous_sponge: false

initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "1days"
FLOAT_TYPE: "Float64"

rad: "gray"
dt_rad: "1hours"

energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux
  - name: rad
    source: radiation
  - name: mp
    source: microphysics
  - name: new_tropics
    region: tropics
    source: all
  - name: new_extratropics
    region: extratropics
    source: all

energy_process_record: [radiation, surface_flux, microphysics]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc, e_src_rad]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_tropics, e_src_new_extratropics]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_microphysics]
    period: "1hours"
  - short_name: [ta]
    period: "1hours"
