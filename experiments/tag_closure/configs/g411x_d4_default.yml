# E83's rerun of g411_d4_default.yml with OD4's exact throughput (2026-09-25); otherwise unchanged.
# Pre-registered in design/ENERGY_COPY_MIRRORS.md, section 5, before any run.
# G4.15's D4 day (`g415_inc_d4_after`): 1M stepped implicitly, one Newton
# iteration, a day, eight energy tags under `enthalpy_increment`; the default
# mode, no copies, from the mirrors' run tree: the other side of default against
# copies.

job_id: "g411x_d4_default"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true
energy_source_tag_transport: "enthalpy_increment"
# E83's rerun: the exact gross source throughput (OD4, #115).
energy_source_tag_ledger_per_tag: true

# `d4_column_edmf`, unchanged.
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: false
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"

dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation
  - name: sfc
    source: surface_flux
  - name: sub
    source: subsidence
  - name: mp
    source: microphysics
  - name: new_strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
    source: all
  - name: new_tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
    source: all

energy_process_record:
  [radiation, surface_flux, subsidence, microphysics, precipitation]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad, e_src_sfc, e_src_sub]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_strat, e_src_new_tropo]
    period: "1hours"
  - short_name: [e_src_fix_strat, e_src_fix_tropo, e_src_fix_rad, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_inc_left, e_src_inc_moved, ta, rhoa, hus]
    period: "1hours"
  - short_name: [e_src_fix_sub, e_src_fix_mp, e_src_fix_new_strat]
    period: "1hours"
  - short_name: [e_src_fix_new_tropo]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_subsidence]
    period: "1hours"
  - short_name: [e_prc_microphysics, e_prc_precipitation]
    period: "1hours"
  - short_name: [e_src_inc_left, e_src_inc_moved]
    period: "1hours"
  - short_name: [rhoa, ta]
    period: "1hours"
  # The model's own fields, for parity (bit for bit) between the runs.
  - short_name: [rhoa, ta, hus, clw, cli, husra, hussn, wa]
    period: "1hours"
  - short_name: [pr, prra, prsn, hfls, hfss, lwp, rwp]
    period: "1hours"
  - short_name: [arup, rhoaup, waup, husup, clwup, cliup, husraup, hussnup]
    period: "1hours"
  - short_name: [tke, edt, evu]
    period: "1hours"
