# V-W8 (G3_PLAN 6): a file-based column with water and energy tags. The
# GCM-driven column of `config/model_configs/prognostic_edmfx_gcmdriven_column.yml`
# (HadGEM2-A AMIP forcing, site 23, 0M, prognostic EDMF, 60 stretched levels to
# 40 km), for 3 h instead of 6. The owner chose it over the ERA5 column, whose
# forcing is not downloadable (G3_TODO, Decisions).
#
# What it checks: the water tags under EDMF (WP3, the default mode) and the
# energy source tags run together on a column whose forcing comes from a file,
# with the external forcing and the nudging of `q_tot` attributed to a source
# tag (`fcg`), the sponge on, and 0M rain-out. The closure of both families,
# the audit, and parity against the untagged twin `w8_gcm_untagged`.
job_id: "w8_gcm_tags"

water_tracers:
  - name: pbl
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0, above: false}
  - name: free
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0}
  - name: evap
    source: surface_flux
  - name: fcg
    source: forcing

water_closure_check:
  period: "30mins"
  audit: true

energy_source_tags:
  - name: pbl
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0, above: false}
  - name: free
    region: {type: tanh_altitude, z_center: 1000.0, width: 200.0}
  - name: sfc
    source: surface_flux
  - name: rad
    source: radiation
energy_source_tag_offset: 110495.0

energy_source_closure_check:
  period: "30mins"
  audit: true

initial_condition: "GCM"
external_forcing_file: artifact"cfsite_gcm_forcing"/HadGEM2-A_amip.2004-2008.07.nc
cfsite_number: "site23"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
rayleigh_sponge: true
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
microphysics_model: "0M"
config: "column"
z_max: 40e3
z_elem: 60
z_stretch: true
dz_bottom: 30
perturb_initstate: false
dt: "10secs"
dt_rad: "30mins"
t_end: "3hours"
toml: [toml/prognostic_edmfx_gcmdriven.toml]
rad: allskywithclear
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  - short_name: [rhoa, ta, hus, clw, cli, wa]
    period: "30mins"
  - short_name: [pr, evspsbl, hfls, hfss, lwp]
    period: "30mins"
  - short_name: [arup, rhoaup, waup, husup, aren, rhoaen, waen, husen]
    period: "30mins"
  - short_name: [tke, edt, evu, entr, detr]
    period: "30mins"
  - short_name: [q_tag_res, q_tag_pbl, q_tag_free, q_tag_evap, q_tag_fcg]
    period: "30mins"
  - short_name: [q_tag_fix_pbl, q_tag_fix_free, q_tag_fix_evap, q_tag_fix_fcg]
    period: "30mins"
  - short_name: [e_src_res, e_src_pbl, e_src_free, e_src_sfc, e_src_rad]
    period: "30mins"
  - short_name: [pr]
    period: "30mins"
    reduction_time: average
