# C0. The barrier census on a sphere, for a day.
#
# The column above is where the non-positive parent is worst, because ρe_tot
# climbs with geopotential and a 1.5 km domain has none of it. A sphere reaching
# 30 km is the other end of that range, and the pair brackets how much of the
# problem is the domain and how much is the energy reference itself.
#
# Same grid as phase B, so the sphere cost of the two energy families can be set
# against each other.

job_id: "c0_sphere"

config: "sphere"
h_elem: 6
nh_poly: 3
z_elem: 10
z_max: 30000.0
dz_bottom: 500.0
dt: "400secs"
ode_algo: "ARS343"
rayleigh_sponge: false
viscous_sponge: false

initial_condition: "MoistBaroclinicWave"
microphysics_model: "0M"
t_end: "1days"
FLOAT_TYPE: "Float64"

# `tropics` and `extratropics` are exact complements and partition ρe_tot.
# `sfc` follows the turbulent surface energy flux, which is on by default and is
# the process that forces this configuration.
energy_source_tags:
  - name: tropics
    region: tropics
  - name: extratropics
    region: extratropics
  - name: sfc
    source: surface_flux

# Hourly over a day, `tolerance` unset.
energy_source_closure_check:
  period: "1hours"

# Instantaneous, defaults off. No ledger exists for this family, so there is no
# operator-residual subtraction to make. The per-tag fields are here because
# `e_src_res` covers the region tags only, so a source tag going negative never
# shows up in it and has to be watched directly.
output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_tropics, e_src_extratropics, e_src_sfc]
    period: "1hours"
