# G3 baselines on main b34bbd8b (design/G3_BASELINE_RERUN.md): TRMM 0M, 6 h, no tags.
# The untagged twin of `g3b_trmm0m_{default,copies}_6h`: parity, and the parent's water
# every 10 minutes for OD2's rule (reported only on TRMM).

job_id: "g3b_trmm0m_untagged_6h"

initial_condition: TRMM_LBA
turbconv: prognostic_edmfx
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "PiGroups"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
cloud_model: "grid_scale"
microphysics_model: "0M"
config: column
z_max: 16400
x_elem: 2
y_elem: 2
z_elem: 82
z_stretch: false
dz_bottom: 30
dt: 150secs
t_end: 6hours
toml: [toml/prognostic_edmfx_implicit_scm_calibrated_5_cases_shallow_deep_v1.toml]
ode_algo: "ARS222"
FLOAT_TYPE: "Float64"

output_default_diagnostics: false
diagnostics:
  - short_name: [rhoa, ta, hus, clw, cli, wa]
    period: "30mins"
  - short_name: [pr, evspsbl, hfls, hfss, lwp]
    period: "30mins"
  - short_name: [pr]
    period: "30mins"
    reduction_time: average
  - short_name: [arup, rhoaup, waup, husup, clwup, cliup]
    period: "30mins"
  - short_name: [aren, rhoaen, waen, husen]
    period: "30mins"
  - short_name: [tke, entr, detr]
    period: "30mins"
  - short_name: [rhoa, hus]
    period: "10mins"

# Compared runs reset the radiation's seed (RUNS.md, 2026-10-02). TRMM_LBA
# here has no RRTMGP radiation, so the key changes nothing.
radiation_reset_rng_seed: true
