# D4, column, EDMF, with the tags moved as enthalpy: `d4_column_edmf` with
# `energy_source_tag_transport: enthalpy`, and nothing else changed
# (ENTHALPY_AUDIT_DESIGN.md; SUBGRID_AND_MICROPHYSICS_DESIGN.md).
#
# It runs today only with `edmfx_vertical_diffusion: false`, for the reason
# `d4_column_edmf` gives.
#
# The audit removes grid-mean pressure work from the residual. On C9's column,
# without EDMF, that left 2,284 J/m² at 24 h, against 2,442,276 under tracer
# transport (E34). Under EDMF the audit still does not reach the SGS terms. What
# grows in this run's residual after the first hour is therefore what the tags
# do not follow:
#   - the SGS mass flux, which no tag receives, since none has an updraft copy;
#   - the sedimentation corrections, which are not shared;
#   - the SGS diffusive flux, which moves the tags in tracer form while the
#     parent moves enthalpy.
#
# What it decides: the size option B must close, the SGS mass flux and the
# corrections, and what is left for B3, the diffusive flux. After B, this run
# should come back towards C9's floor, less whatever B3 would take.
#
# `ta` must be identical to `d4_column_edmf`'s, to the last bit, since only the
# tags differ.
job_id: "d4_column_edmf_enthalpy"

energy_source_tag_offset: 110495.0
energy_source_tag_repair: true
energy_source_tag_transport: "enthalpy"

# `d4_column_edmf`, unchanged.
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: false
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 30
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"

dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float64"

energy_source_tags:
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: rad
    source: radiation
  - name: sfc
    source: surface_flux
  - name: sub
    source: subsidence
  - name: mp
    source: microphysics
  - name: new_strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
    source: all
  - name: new_tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
    source: all

energy_process_record:
  [radiation, surface_flux, subsidence, microphysics, precipitation]

energy_source_closure_check:
  period: "1hours"
  audit: true

output_default_diagnostics: false
diagnostics:
  - short_name: [e_src_res]
    period: "1hours"
  - short_name: [e_src_strat, e_src_tropo, e_src_rad, e_src_sfc, e_src_sub]
    period: "1hours"
  - short_name: [e_src_mp, e_src_new_strat, e_src_new_tropo]
    period: "1hours"
  - short_name: [e_src_fix_strat, e_src_fix_tropo, e_src_fix_rad, e_src_fix_sfc]
    period: "1hours"
  - short_name: [e_src_fix_sub, e_src_fix_mp, e_src_fix_new_strat]
    period: "1hours"
  - short_name: [e_src_fix_new_tropo]
    period: "1hours"
  - short_name: [e_prc_radiation, e_prc_surface_flux, e_prc_subsidence]
    period: "1hours"
  - short_name: [e_prc_microphysics, e_prc_precipitation]
    period: "1hours"
  - short_name: [rhoa, ta]
    period: "1hours"
