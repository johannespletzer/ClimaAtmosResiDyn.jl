# Part 9, WP4b stage 2 (design/PART9_WP4B_EDMF.md, section 7): D4-W a day, three tags with the rain and snow parts under EDMF, increment transport.
job_id: "p9_d4w_rs_on_1d"
water_tracers:
  - name: tropo
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0, above: false}
  - name: strat
    region: {type: tanh_altitude, z_center: 750.0, width: 100.0}
  - name: evap
    source: surface_flux
water_tag_precipitation: true
water_tag_transport: "increment"
water_tag_ledger_per_tag: true
water_closure_check:
  period: "30mins"
  audit: true
initial_condition: "DYCOMS_RF02"
turbconv: "prognostic_edmfx"
implicit_diffusion: true
approximate_linear_solve_iters: 2
edmfx_entr_model: "Generalized"
edmfx_detr_model: "Generalized"
edmfx_sgs_mass_flux: true
edmfx_sgs_diffusive_flux: true
edmfx_nh_pressure: true
edmfx_vertical_diffusion: true
edmfx_filter: true
prognostic_tke: true
microphysics_model: "1M"
fixed_terminal_velocity_liquid: false
rad: "DYCOMS"
config: "column"
z_elem: 60
z_max: 1500.0
z_stretch: false
perturb_initstate: false
toml: [toml/prognostic_edmfx_1M.toml]
ode_algo: "ARS222"
dt: "120secs"
t_end: "1days"
FLOAT_TYPE: "Float64"
radiation_reset_rng_seed: true
output_default_diagnostics: false
diagnostics:
  - short_name: [rhoa, ta, hus, clw, cli, husra, hussn, wa]
    period: "30mins"
  - short_name: [pr, prra, prsn, evspsbl, hfls, hfss]
    period: "30mins"
  - short_name: [arup, rhoaup, husup, husraup, hussnup]
    period: "30mins"
  - short_name: [q_tag_res, q_ntag_res, q_rtag_res, q_stag_res]
    period: "30mins"
  - short_name: [q_tag_tropo, q_tag_strat, q_tag_evap]
    period: "30mins"
  - short_name: [q_ntag_tropo, q_ntag_strat, q_ntag_evap]
    period: "30mins"
  - short_name: [q_rtag_tropo, q_rtag_strat, q_rtag_evap]
    period: "30mins"
  - short_name: [q_stag_tropo, q_stag_strat, q_stag_evap]
    period: "30mins"
  - short_name: [q_rtag_aud_tropo, q_rtag_aud_strat, q_rtag_aud_evap]
    period: "30mins"
  - short_name: [q_stag_aud_tropo, q_stag_aud_strat, q_stag_aud_evap]
    period: "30mins"
  - short_name: [q_tag_aud_up_tropo, q_tag_aud_up_strat, q_tag_aud_up_evap]
    period: "30mins"
    reduction_time: average
  - short_name: [pr_tag_tropo, pr_tag_strat, pr_tag_evap]
    period: "30mins"
  - short_name: [q_tag_fix_tropo, q_tag_fix_strat, q_tag_fix_evap]
    period: "30mins"
  - short_name: [q_tag_led_close, q_tag_led_rescale, q_tag_led_empty]
    period: "30mins"
  - short_name: [q_tag_inc_left, q_tag_inc_moved]
    period: "30mins"
  - short_name: [q_tag_led_inc_tropo, q_tag_led_inc_strat, q_tag_led_inc_evap]
    period: "30mins"
  - short_name: [pr]
    period: "30mins"
    reduction_time: average
  - short_name: [q_tag_led_close_gross, q_tag_led_rescale_gross, q_tag_led_empty_gross, q_tag_exp_negative_precip_gross]
    period: "30mins"
  - short_name: [q_tag_led_close_attempted, q_tag_led_rescale_attempted, q_tag_led_empty_attempted]
    period: "30mins"
  - short_name: [q_tag_led_fixgross_tropo, q_tag_led_fixgross_strat, q_tag_led_fixgross_evap]
    period: "30mins"
